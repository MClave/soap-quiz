          render();
        }
      }));
      row.appendChild(actions);
    } else if (opts && opts.sourceLocked) {
      const actions = el("div", { class: "discarded-actions" });
      actions.appendChild(el("span", { class: "muted small", text: "Discarded in source \u2014 not restorable from the UI." }));
      row.appendChild(actions);
    }
    return row;
  }

  const sessionItems = destroyedListForState(state);
  const sourceItems = Object.keys(SOURCE_DISCARDED)
    .map(function (k) { return +k; })
    .map(function (id) { return { id: id, q: QUESTIONS.find(function (x) { return x.id === id; }) }; })
    .filter(function (e) { return e.q; })
    .sort(function (a, b) { return a.id - b.id; });

  if (sessionItems.length === 0 && sourceItems.length === 0) {
    modal.appendChild(el("p", { class: "muted", text: "Nothing discarded." }));
  }

  if (sessionItems.length > 0) {
    modal.appendChild(el("h4", { class: "discarded-section-head", text: "Discarded in this session" }));
    const list = el("div", { class: "discarded-list" });
    sessionItems.forEach(function (entry) { list.appendChild(buildItemRow(entry.q, { restorable: true })); });
    modal.appendChild(list);
  }

  if (sourceItems.length > 0) {
    modal.appendChild(el("h4", { class: "discarded-section-head", text: "Discarded in source (" + sourceItems.length + ")" }));
    modal.appendChild(el("p", { class: "muted small discarded-section-desc", text: "These questions are pre-marked as discarded in the question bank itself. They are hidden from every mode and every user." }));
    const list = el("div", { class: "discarded-list" });
    sourceItems.forEach(function (entry) { list.appendChild(buildItemRow(entry.q, { sourceLocked: true })); });
    modal.appendChild(list);
  }
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function renderOnboarding() {
  const modes = [
    { id: "practice_no_truth", name: "Create ground truth", desc: "Author the ground truth for the question bank. No scoring, no feedback \u2014 just your considered answers, autosaved." },
    { id: "test", name: "Test mode", desc: "Take a short scored test against a loaded ground truth file." }
  ];

  const step1 = el("div", { class: "step" });
  step1.appendChild(el("h3", { text: "1. How do you want to play?" }));
  modes.forEach(function (m) {
    const wrap = el("label", { class: "mode-option" + (pendingMode === m.id ? " selected" : ""), for: "mode-" + m.id });
    const radio = el("input", { type: "radio", name: "mode", id: "mode-" + m.id, value: m.id });
    if (pendingMode === m.id) radio.checked = true;
    radio.addEventListener("change", function () {
      pendingMode = m.id;
      render();
    });
    wrap.appendChild(radio);
    const inner = el("span", { class: "mode-label" });
    inner.appendChild(el("span", { class: "mode-name", text: m.name }));
    inner.appendChild(el("span", { class: "mode-desc", text: m.desc }));
    wrap.appendChild(inner);
    step1.appendChild(wrap);
  });
  app.appendChild(step1);

  if (pendingMode === null) return;
  const isTestMode = pendingMode === "test";
  const isAuthoring = pendingMode === "practice_no_truth";
  let stepNum = 2;

  // Step 2 (authoring only): identity selector.
  if (isAuthoring) {
    const stepIdentity = el("div", { class: "step" });
    stepIdentity.appendChild(el("h3", { text: stepNum + ". Who's playing?" }));
    IDENTITIES.forEach(function (idKey) {
      const wrap = el("label", { class: "mode-option identity-option identity-option-" + idKey + (pendingIdentity === idKey ? " selected" : ""), for: "identity-" + idKey });
      const radio = el("input", { type: "radio", name: "identity", id: "identity-" + idKey, value: idKey });
      if (pendingIdentity === idKey) radio.checked = true;
      radio.addEventListener("change", function () {
        pendingIdentity = idKey;
        persistActiveIdentity();
        render();
      });
      wrap.appendChild(radio);
      const inner = el("span", { class: "mode-label" });
      inner.appendChild(el("span", { class: "mode-name", text: IDENTITY_LABELS[idKey] }));
      inner.appendChild(el("span", { class: "mode-desc", text: IDENTITY_DESCRIPTIONS[idKey] }));
      wrap.appendChild(inner);
      stepIdentity.appendChild(wrap);
    });
    if (pendingIdentity === "frances" && !mode1SavedSessions.flore_mathieu) {
      stepIdentity.appendChild(el("p", { class: "muted small", text: "No draft from Flore & Mathieu found yet. Frances normally builds on top of that draft. You can still proceed and author from scratch." }));
    }
    app.appendChild(stepIdentity);
    stepNum++;
  }

  const stepQS = el("div", { class: "step" });
  stepQS.appendChild(el("h3", { text: stepNum + ". Question set" }));
  const qsOptions = [
    { id: "subsection", name: "Subsection mode", desc: "Subsection questions only" },
    { id: "soap", name: "SOAP mode", desc: "SOAP questions only" },
    { id: "both", name: "Both", desc: "Default \u2014 subsection and SOAP" }
  ];
  qsOptions.forEach(function (qs) {
    const wrap = el("label", { class: "mode-option" + (pendingQuestionSet === qs.id ? " selected" : ""), for: "qs-" + qs.id });
    const radio = el("input", { type: "radio", name: "question-set", id: "qs-" + qs.id, value: qs.id });
    if (pendingQuestionSet === qs.id) radio.checked = true;
    radio.addEventListener("change", function () {
      pendingQuestionSet = qs.id;
      render();
    });
    wrap.appendChild(radio);
    const inner = el("span", { class: "mode-label" });
    inner.appendChild(el("span", { class: "mode-name", text: qs.name }));
    inner.appendChild(el("span", { class: "mode-desc", text: qs.desc }));
    wrap.appendChild(inner);
    stepQS.appendChild(wrap);
  });
  app.appendChild(stepQS);
  stepNum++;

  if (isAuthoring) {
    const stepDiff = el("div", { class: "step" });
    stepDiff.appendChild(el("h3", { text: stepNum + ". Difficulty" }));
    VALID_DIFFICULTIES.forEach(function (d) {
      const row = el("div", { class: "field-inline" });
      const cb = el("input", { type: "checkbox", id: "diff-" + d });
      cb.checked = pendingDifficulties.indexOf(d) !== -1;
      cb.addEventListener("change", function () {
        const has = pendingDifficulties.indexOf(d) !== -1;
        if (cb.checked && !has) pendingDifficulties.push(d);
        else if (!cb.checked && has) {
          if (pendingDifficulties.length <= 1) {
            cb.checked = true;
            return;
          }
          pendingDifficulties = pendingDifficulties.filter(function (x) { return x !== d; });
        }
      });
      row.appendChild(cb);
      row.appendChild(el("label", { for: "diff-" + d, text: DIFFICULTY_LABELS[d] }));
      stepDiff.appendChild(row);
    });
    stepDiff.appendChild(el("p", { class: "muted", text: "At least one must remain checked." }));
    app.appendChild(stepDiff);
    stepNum++;
  }

  // Randomize toggle: Create-ground-truth mode for Frances only.
  // Mathieu's order is forced (difficulty -> category -> id) to keep the draft pass efficient.
  const showRandomize = isAuthoring && pendingIdentity === "frances";
  if (showRandomize) {
    const stepRand = el("div", { class: "step" });
    stepRand.appendChild(el("h3", { text: stepNum + ". Question order" }));
    const row = el("div", { class: "field-inline" });
    const cb = el("input", { type: "checkbox", id: "randomize" });
    cb.checked = !!pendingRandomize;
    cb.addEventListener("change", function () {
      pendingRandomize = cb.checked;
    });
    row.appendChild(cb);
    row.appendChild(el("label", { for: "randomize", text: "Shuffle question order" }));
    stepRand.appendChild(row);
    stepRand.appendChild(el("p", { class: "muted small", text: "If unchecked, Frances follows the same fixed authoring order as Flore & Mathieu." }));
    app.appendChild(stepRand);
    stepNum++;
  }

  if (isAuthoring) {
    if (pendingIdentity === "flore_mathieu") {
      app.appendChild(el("p", { class: "muted", text: "Authoring presents questions in a fixed order optimized for ground truth work: easy first, then medium, then hard \u2014 grouped by category within each difficulty band." }));
    } else if (!pendingRandomize) {
      app.appendChild(el("p", { class: "muted", text: "Frances will see the same fixed authoring order \u2014 easy first, then medium, then hard, grouped by category within each difficulty band." }));
    } else {
      app.appendChild(el("p", { class: "muted", text: "Frances will see questions in a shuffled order." }));
    }
  } else {
    const counts = countTestBandAvailability(pendingQuestionSet, GROUND_TRUTH);
    let total = 0;
    VALID_DIFFICULTIES.forEach(function (d) { total += counts[d].used; });
    const breakdown = el("div", { class: "test-breakdown" });
    const bands = el("div");
    VALID_DIFFICULTIES.forEach(function (d) {
      const b = el("span", { class: "band" + (counts[d].available < counts[d].target ? " short" : "") });
      b.appendChild(el("strong", { text: DIFFICULTY_LABELS[d] + ": " }));
      b.appendChild(document.createTextNode(counts[d].used + " / " + counts[d].target + (counts[d].available < counts[d].target ? " (only " + counts[d].available + " in pool)" : "")));
      bands.appendChild(b);
    });
    breakdown.appendChild(bands);
    const shapeParts = VALID_DIFFICULTIES.map(function (d) { return TEST_SEQUENCE_SHAPE[d] + " " + d; }).join(" \u00b7 ");
    breakdown.appendChild(el("p", { class: "muted", text: "Test will be " + total + " question" + (total === 1 ? "" : "s") + " (target shape: " + shapeParts + "). Pool: questions matching the chosen set with a ground-truth entry." }));
    app.appendChild(breakdown);
  }

  const startLabel = isAuthoring ? ("Start authoring as " + IDENTITY_LABELS[pendingIdentity]) : "Start test";
  const startBtn = el("button", {
    class: "primary",
    text: startLabel,
    onclick: function () {
      const overwriting = isAuthoring ? mode1SavedSessions[pendingIdentity] : genericSavedSession;
      if (overwriting) {
        if (!confirm("Starting a new session will erase saved progress for " + overwriting.player + ". Continue?")) return;
      }
      const difficulties = isTestMode ? VALID_DIFFICULTIES.slice() : pendingDifficulties.slice();
      const playerName = isAuthoring ? IDENTITY_LABELS[pendingIdentity] : "Test player";
      const wantRandom = isAuthoring && pendingIdentity === "frances" && !!pendingRandomize;
      startSession({
        identity: isAuthoring ? pendingIdentity : null,
        player: playerName,
        mode: pendingMode,
        questionSet: pendingQuestionSet,
        difficulties: difficulties,
        randomize: wantRandom,
        groundTruth: isTestMode ? GROUND_TRUTH : null
      });
    }
  });

  const startRow = el("div", { class: "button-row" });
  startRow.appendChild(startBtn);
  app.appendChild(startRow);
}

function renderHeaderBar() {
  const bar = el("div", { class: "header-bar" });

  if (currentIndex > 0) {
    bar.appendChild(el("button", {
      class: "link",
      text: "\u2190 Back",
      onclick: back
    }));
  }

  const authorLabel = (session.mode === "practice_no_truth") ? "Author: " : "Player: ";
  const playerSpan = el("span", { class: "player", text: authorLabel + session.player });
  if (session.identity) playerSpan.classList.add("identity-" + session.identity);
  bar.appendChild(playerSpan);
  bar.appendChild(el("span", { class: "progress-text", text: "Q " + (currentIndex + 1) + " / " + session.order.length }));
  const qHere = getQuestion(currentIndex);
  if (qHere) {
    bar.appendChild(el("span", { class: "question-id-tag", text: "#" + qHere.id }));
  }

  if (session.mode === "test") {
    if (qHere) bar.appendChild(el("span", { class: "diff-tag diff-" + qHere.difficulty, text: DIFFICULTY_LABELS[qHere.difficulty] }));
  }

  if (session.groundTruth) {
    const score = computeScore();
    bar.appendChild(el("span", { class: "pill", text: "Score: " + score.correct + " / " + score.answeredWithTruth }));
  }

  let skipped = 0;
  session.order.forEach(function (id) { if (session.answers[id] === null) skipped++; });
  bar.appendChild(el("span", { class: "pill pill-neutral", text: "Skipped: " + skipped }));

  if (session.mode === "practice_no_truth") {
    const eta = computeETA();
    if (eta) {
      bar.appendChild(el("span", { class: "eta-text", text: formatEtaLabel(eta) }));
    }
    const savedInd = el("span", { class: "saved-indicator", text: "Saved \u2713" });
    savedInd.id = "saved-indicator";
    bar.appendChild(savedInd);
    bar.appendChild(el("button", {
      class: "header-mini-btn",
      text: "Jump to\u2026",
      onclick: function () { jumpPanelOpen = !jumpPanelOpen; render(); }
    }));
    bar.appendChild(el("button", {
      class: "finish spacer",
      text: "Export current state",
      onclick: triggerExportCurrentState
    }));
    bar.appendChild(el("button", {
      class: "finish",
      text: "End session",
      onclick: triggerEndSession
    }));
  } else {
    bar.appendChild(el("button", {
      class: "finish spacer",
      text: "Finish & export",
      onclick: triggerFinish
    }));
  }

  return bar;
}

function renderJumpPanel() {
  const panel = el("div", { class: "jump-panel" });
  panel.appendChild(el("div", { class: "jump-panel-title", text: "Jump to\u2026" }));

  const inputRow = el("div", { class: "jump-row" });
  const input = el("input", { type: "number", placeholder: "Question id", class: "jump-id-input", min: "1" });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const id = parseInt(input.value, 10);
      if (!isNaN(id)) jumpToId(id);
    }
  });
  inputRow.appendChild(input);
  inputRow.appendChild(el("button", {
    class: "secondary",
    text: "Go",
    onclick: function () {
      const id = parseInt(input.value, 10);
      if (!isNaN(id)) jumpToId(id);
    }
  }));
  panel.appendChild(inputRow);

  panel.appendChild(el("div", { class: "jump-section-label", text: "Next unanswered by difficulty" }));
  const diffRow = el("div", { class: "jump-row" });
  VALID_DIFFICULTIES.forEach(function (d) {
    diffRow.appendChild(el("button", {
      class: "secondary jump-chip",
      text: DIFFICULTY_LABELS[d],
      onclick: function () {
        const i = findNextMatching(function (id) {
          const q = QUESTIONS.find(function (x) { return x.id === id; });
          if (!q || q.difficulty !== d) return false;
          const a = session.answers[id];
          return a === null || a === undefined;
        });
        if (i >= 0) jumpToIndex(i);
      }
    }));
  });
  panel.appendChild(diffRow);

  panel.appendChild(el("div", { class: "jump-section-label", text: "Next unanswered by category" }));
  const cats = {};
  session.order.forEach(function (id) {
    if (isDestroyed(id)) return;
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (q) cats[q.category] = true;
  });
  const catNames = Object.keys(cats).sort();
  const catSelect = el("select", { class: "jump-cat-select" });
  catSelect.appendChild(el("option", { value: "", text: "Choose category\u2026" }));
  catNames.forEach(function (c) {
    catSelect.appendChild(el("option", { value: c, text: c }));
  });
  catSelect.addEventListener("change", function () {
    const c = catSelect.value;
    if (!c) return;
    const i = findNextMatching(function (id) {
      const q = QUESTIONS.find(function (x) { return x.id === id; });
      if (!q || q.category !== c) return false;
      const a = session.answers[id];
      return a === null || a === undefined;
    });
    if (i >= 0) jumpToIndex(i);
  });
  panel.appendChild(catSelect);

  const moreRow = el("div", { class: "jump-row" });
  moreRow.appendChild(el("button", {
    class: "secondary jump-chip",
    text: "Next uncertain",
    onclick: function () {
      const i = findNextMatching(function (id) {
        return !!(session.uncertain && session.uncertain[id]);
      });
      if (i >= 0) jumpToIndex(i);
    }
  }));
  moreRow.appendChild(el("button", {
    class: "secondary jump-chip",
    text: "Next with note",
    onclick: function () {
      const i = findNextMatching(function (id) {
        return !!(session.notes && typeof session.notes[id] === "string" && session.notes[id].trim() !== "");
      });
      if (i >= 0) jumpToIndex(i);
    }
  }));
  moreRow.appendChild(el("button", {
    class: "link",
    text: "Close",
    onclick: function () { jumpPanelOpen = false; render(); }
  }));
  panel.appendChild(moreRow);

  return panel;
}

function renderMode1ProgressBars(q) {
  const qs = session.questionSet || "both";
  const diffs = (session.difficulties || VALID_DIFFICULTIES);
  const scopeQs = QUESTIONS.filter(function (x) {
    if (isSourceDiscarded(x.id)) return false;
    if (qs !== "both" && x.set !== qs) return false;
    if (diffs.indexOf(x.difficulty) === -1) return false;
    return true;
  });

  const isFilled = function (id) {
    if (isDestroyed(id)) return true;
    const a = session.answers[id];
    return a !== null && a !== undefined;
  };

  const overallTotal = scopeQs.length;
  const overallFilled = scopeQs.filter(function (x) { return isFilled(x.id); }).length;

  const curDiff = q.difficulty;
  const diffQs = scopeQs.filter(function (x) { return x.difficulty === curDiff; });
  const diffTotal = diffQs.length;
  const diffFilled = diffQs.filter(function (x) { return isFilled(x.id); }).length;

  const curCat = q.category;
  const catQs = diffQs.filter(function (x) { return x.category === curCat; });
  const catTotal = catQs.length;
  const catFilled = catQs.filter(function (x) { return isFilled(x.id); }).length;

  const wrap = el("div", { class: "mode1-bars" });
  function mkBar(label, filled, total, key) {
    const pct = total > 0 ? Math.min(100, (filled / total) * 100) : 0;
    const initial = typeof mode1BarValues[key] === "number" ? mode1BarValues[key] : 0;
    const row = el("div", { class: "mode1-bar" });
    row.appendChild(el("span", { class: "mode1-bar-label", text: label }));
    const track = el("div", { class: "mode1-bar-track" });
    const fill = el("div", { class: "mode1-bar-fill", style: "width: " + initial + "%" });
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", { class: "mode1-bar-frac", text: filled + " / " + total }));
    requestAnimationFrame(function () { fill.style.width = pct + "%"; });
    mode1BarValues[key] = pct;
    return row;
  }
  wrap.appendChild(mkBar("Overall", overallFilled, overallTotal, "overall"));
  wrap.appendChild(mkBar(DIFFICULTY_LABELS[curDiff], diffFilled, diffTotal, "diff-" + curDiff));
  wrap.appendChild(mkBar(curCat, catFilled, catTotal, "cat-" + curDiff + "-" + curCat));
  return wrap;
}

function renderDiscardRow() {
  const row = el("div", { class: "discard-row" });
  if (pendingDiscardConfirm) {
    row.appendChild(el("span", { class: "discard-confirm-text", text: "Discard this question? " }));
    row.appendChild(el("button", { class: "discard-confirm-yes", text: "Yes", onclick: discardCurrent }));
    row.appendChild(el("button", { class: "discard-confirm-cancel", text: "Cancel", onclick: function () { pendingDiscardConfirm = false; render(); } }));
  } else {
    row.appendChild(el("button", {
      class: "discard-link",
      text: "Discard question",
      onclick: function () { pendingDiscardConfirm = true; render(); }
    }));
  }
  return row;
}

function renderProgressBar() {
  if (session.mode === "test") {
    const bar = el("div", { class: "progress-bar segmented" });
    session.order.forEach(function (id) {
      const q = QUESTIONS.find(function (x) { return x.id === id; });
      const diff = q ? q.difficulty : "medium";
      const filled = Object.prototype.hasOwnProperty.call(session.answers, id);
      const seg = el("div", { class: "seg seg-" + diff + (filled ? " filled" : "") });
      bar.appendChild(seg);
    });
    return bar;
  }
  const bar = el("div", { class: "progress-bar" });
  bar.appendChild(el("div", { class: "progress-fill", style: "width: " + (((currentIndex + 1) / session.order.length) * 100) + "%" }));
  return bar;
}

function renderQuiz() {
  if (!session) { screen = "landing"; render(); return; }
  if (currentIndex >= session.order.length) { screen = "results"; render(); return; }
  const q = getQuestion(currentIndex);
  if (q && isDestroyed(q.id)) {
    const fwd = nextLiveIndex(currentIndex + 1, +1);
    if (fwd >= session.order.length) {
      const bwd = nextLiveIndex(currentIndex - 1, -1);
      if (bwd < 0) { screen = "results"; render(); return; }
      currentIndex = bwd;
    } else {
      currentIndex = fwd;
    }
    render();
    return;
  }
  const isTestMode = session.mode === "test";
  const isMode1 = session.mode === "practice_no_truth";

  if (!session.playOrder) session.playOrder = [];
  if (q && session.playOrder.indexOf(q.id) === -1) {
    session.playOrder.push(q.id);
    saveSession();
  }

  const feedback = isFeedbackActive();
  const mode1Post = isMode1 && isMode1Post();
  if (q) {
    if (feedback || mode1Post) ensureTimingStopped(q.id);
    else ensureTimingActive(q.id);
  }

  app.appendChild(renderHeaderBar());

  let mainTarget;
  const showSidebar = isTestMode || isMode1;
  if (showSidebar) {
    const layout = el("div", { class: "test-layout" });
    mainTarget = el("div", { class: "test-main" });
    layout.appendChild(mainTarget);
    layout.appendChild(renderSidebar(q.set));
    app.appendChild(layout);
  } else {
    mainTarget = app;
  }

  if (isMode1) {
    mainTarget.appendChild(renderMode1ProgressBars(q));
    if (jumpPanelOpen) mainTarget.appendChild(renderJumpPanel());
    if (shouldShowExportReminder()) {
      mainTarget.appendChild(renderExportBanner());
    }
    if (!session.hideRecentStrip) {
      const strip = renderRecentStrip(q);
      if (strip) mainTarget.appendChild(strip);
    }
    if (currentIndex > 0) {
      const prevQ = getQuestion(currentIndex - 1);
      if (prevQ && prevQ.category !== q.category) {
        appendCategoryBanner(mainTarget, q);
      }
    }
  } else {
    mainTarget.appendChild(renderProgressBar());
  }

  const body = el("div", { class: "question-container" + (suppressNextFade ? "" : " fade-in") });
  suppressNextFade = false;

  body.appendChild(el("div", { class: "situation", text: q.situation }));
  const transcriptEl = el("div", { class: "transcript" });
  transcriptEl.appendChild(renderTranscript(q.transcript));
  body.appendChild(transcriptEl);
  body.appendChild(el("div", { class: "instruction", text: "Where should the highlighted part go?" }));

  // Frances sees Mathieu's draft answer as a soft hint above the option buttons.
  let mathieuHintForOption = null;
  if (isMode1 && session.identity === "frances" && mathieuDraftCache) {
    const draftAns = (mathieuDraftCache.answers || {})[q.id];
    if (draftAns !== null && draftAns !== undefined) {
      mathieuHintForOption = draftAns;
      const hint = el("div", { class: "mathieu-hint" });
      const line = el("div", { class: "mathieu-hint-line" });
      line.appendChild(document.createTextNode("Flore & Mathieu suggested: "));
      line.appendChild(el("strong", { text: draftAns }));
      const mUnc = mathieuDraftCache.uncertain && mathieuDraftCache.uncertain[q.id];
      if (mUnc) line.appendChild(document.createTextNode(" \u00b7 flagged uncertain"));
      const mNote = mathieuDraftCache.notes && typeof mathieuDraftCache.notes[q.id] === "string" ? mathieuDraftCache.notes[q.id].trim() : "";
      if (mNote) {
        const noteBtn = el("button", {
          class: "mathieu-note-toggle",
          title: expandedMathieuNoteFor === q.id ? "Hide note" : "Show note",
          onclick: function () {
            expandedMathieuNoteFor = (expandedMathieuNoteFor === q.id) ? null : q.id;
            render();
          }
        });
        noteBtn.appendChild(document.createTextNode("\ud83d\udcdd"));
        line.appendChild(noteBtn);
      }
      hint.appendChild(line);
      if (mNote && expandedMathieuNoteFor === q.id) {
        const noteBox = el("div", { class: "mathieu-note" });
        noteBox.textContent = mNote;
        hint.appendChild(noteBox);
      }
      body.appendChild(hint);
    }
  }

  const userChoice = session.answers[q.id];
  const hasRecorded = Object.prototype.hasOwnProperty.call(session.answers, q.id);
  const previousChoice = (!feedback && !mode1Post && hasRecorded && userChoice !== null) ? userChoice : null;
  const truth = session.groundTruth && session.groundTruth[q.id];
  const wireHover = (isTestMode || isMode1) && q.set === "subsection";

  const SOAP_OPT_CLASS = { "Subjective": "opt-subjective", "Objective": "opt-objective", "Assessment": "opt-assessment", "Plan": "opt-plan" };
  const optsClass = "options" + (q.options.length === 2 ? " opts-2" : "") + (mode1Post ? " mode1-post" : "");
  const opts = el("div", { class: optsClass });
  q.options.forEach(function (opt, i) {
    let cls = "option";
    if (!feedback && SOAP_OPT_CLASS[opt]) cls += " " + SOAP_OPT_CLASS[opt];
    const btn = el("button", {
      class: cls,
      onclick: function () {
        // Test-mode feedback: any click advances; the answer is locked once feedback is showing.
        if (feedback) { advance(); return; }
        // Mode-1 post-answer: clicking the already-selected option advances; clicking a different option
        // changes the recorded answer and stays on the question for review.
        if (mode1Post) {
          if (opt === userChoice) advance();
          else selectAnswer(q.id, opt);
          return;
        }
        selectAnswer(q.id, opt);
      }
    });
    btn.appendChild(el("span", { class: "key-hint", text: String(i + 1) }));
    btn.appendChild(document.createTextNode(opt));
    if (feedback) {
      if (opt === truth) btn.className += " correct";
      else if (opt === userChoice) btn.className += " wrong";
      else btn.className += " muted-opt";
    } else if (mode1Post && opt === userChoice) {
      btn.classList.add("mode1-selected");
    } else if (opt === previousChoice) {
      btn.classList.add("previous-choice");
      btn.appendChild(el("span", { class: "prev-tag", text: "your previous answer" }));
    }
    if (mathieuHintForOption && opt === mathieuHintForOption && !feedback) {
      btn.classList.add("from-mathieu");
    }
    if (wireHover) {
      btn.addEventListener("mouseenter", function () { highlightSidebarFor(opt); });
      btn.addEventListener("mouseleave", clearSidebarHighlight);
    }
    opts.appendChild(btn);
  });
  body.appendChild(opts);

  if (feedback) {
    const isCorrect = userChoice === truth;
    if (isCorrect) {
      body.appendChild(el("p", { class: "feedback-line correct-line", text: "Correct." }));
    } else {
      const line = el("p", { class: "feedback-line" });
      line.appendChild(document.createTextNode("Correct answer: "));
      line.appendChild(el("strong", { text: truth }));
      body.appendChild(line);
    }
    const nextRow = el("div", { class: "button-row" });
    nextRow.appendChild(el("button", {
      class: "primary",
      text: "Next \u2192",
      onclick: advance
    }));
    body.appendChild(nextRow);
    body.appendChild(el("p", { class: "muted next-hint", text: "Press Enter or Space to continue." }));
  } else if (mode1Post) {
    const row = el("div", { class: "button-row mode1-post-row" });
    row.appendChild(renderUncertainToggle(q.id));
    row.appendChild(el("button", {
      class: "primary",
      text: "Next \u2192",
      onclick: advance
    }));
    body.appendChild(row);
    body.appendChild(el("p", { class: "muted next-hint", text: "Press Enter or Space to continue \u00b7 click your answer again to advance \u00b7 click another option to change it \u00b7 D to discard." }));
  } else {
    const skipRow = el("div", { class: "skip-row" });
    skipRow.appendChild(el("button", {
      class: "link",
      text: "Skip",
      onclick: function () { selectAnswer(q.id, null); }
    }));
    body.appendChild(skipRow);
  }

  if (isMode1) {
    body.appendChild(renderDiscardRow());
    body.appendChild(renderNoteSection(q.id));
  }

  mainTarget.appendChild(body);
}

function renderUncertainToggle(id) {
  const on = !!(session.uncertain && session.uncertain[id]);
  const btn = el("button", {
    class: "uncertain-toggle" + (on ? " on" : ""),
    title: on ? "Marked uncertain (click to clear)" : "Mark uncertain (revisit later)",
    onclick: function () { setUncertain(id, !on); render(); }
  });
  btn.appendChild(document.createTextNode(on ? "? Uncertain" : "? Uncertain"));
  return btn;
}

function renderNoteSection(id) {
  const wrap = el("div", { class: "note-section" });
  const note = (session.notes && typeof session.notes[id] === "string") ? session.notes[id] : "";
  const expanded = noteExpandedFor.has(id) || note.trim() !== "";
  const toggle = el("button", {
    class: "note-toggle",
    text: expanded ? "Hide note" : (note ? "Edit note" : "Add note"),
    onclick: function () {
      if (noteExpandedFor.has(id)) noteExpandedFor.delete(id);
      else noteExpandedFor.add(id);
      render();
    }
  });
  wrap.appendChild(toggle);
  if (expanded) {
    const ta = el("textarea", { class: "note-textarea", placeholder: "Note for this question (autosaved)", rows: "3" });
    ta.value = note;
    ta.addEventListener("input", function () {
      scheduleNoteSave(id, ta.value);
    });
    wrap.appendChild(ta);
  }
  return wrap;
}

function appendCategoryBanner(target, q) {
  const count = session.order.filter(function (id) {
    const qq = QUESTIONS.find(function (x) { return x.id === id; });
    return qq && qq.difficulty === q.difficulty && qq.category === q.category;
  }).length;
  const banner = el("div", { class: "category-banner" });
  banner.textContent = "Now: " + q.category + " \u00b7 " + count + " question" + (count === 1 ? "" : "s") + " in this block.";
  target.appendChild(banner);
  const removeIt = function () {
    if (banner.parentNode) banner.parentNode.removeChild(banner);
    document.removeEventListener("mousedown", removeIt);
    document.removeEventListener("keydown", removeIt);
  };
  setTimeout(function () {
    document.addEventListener("mousedown", removeIt);
    document.addEventListener("keydown", removeIt);
  }, 50);
  setTimeout(removeIt, 2500);
}

function selectAnswer(id, choice) {
  if (!session) return;
  pendingDiscardConfirm = false;
  const wasNonNull = session.answers[id] !== null && session.answers[id] !== undefined;
  ensureTimingStopped(id);
  dismissedFeedbackFor.delete(id);
  session.answers[id] = choice;
  saveSession();
  flashSaved();
  if (session.mode === "practice_no_truth") {
    if (choice === null) {
      advance();
      return;
    }
    playSessionAnsweredIds.add(id);
    if (!wasNonNull && typeof _lastFinalizedDeltaSec === "number") {
      pushRecentDuration(_lastFinalizedDeltaSec);
    }
    suppressNextFade = true;
    render();
    return;
  }
  const hasGT = session.groundTruth && Object.prototype.hasOwnProperty.call(session.groundTruth, id);
  if (choice !== null && hasGT) {
    render();
  } else {
    advance();
  }
}

function discardCurrent() {
  if (!session) return;
  const q = getQuestion(currentIndex);
  if (!q) return;
  ensureTimingStopped(q.id);
  markDestroyed(q.id);
  if (session.mode === "practice_no_truth") playSessionDiscardedIds.add(q.id);
  pendingDiscardConfirm = false;
  dismissedFeedbackFor.delete(q.id);
  flashSaved();
  advance();
}

function startReview(ids) {
  if (!session || !session.groundTruth || !ids || ids.length === 0) return;
  reviewMode = {
    ids: ids.slice(),
    currentIndex: 0,
    answers: {},
    groundTruth: session.groundTruth
  };
  suppressNextFade = true;
  screen = "review";
  render();
}

function exitReview() {
  reviewMode = null;
  screen = "results";
  suppressNextFade = true;
  render();
}

function reviewAdvance() {
  if (!reviewMode) return;
  reviewMode.currentIndex++;
  if (reviewMode.currentIndex >= reviewMode.ids.length) {
    exitReview();
    return;
  }
  render();
}

function reviewBack() {
  if (!reviewMode || reviewMode.currentIndex === 0) return;
  reviewMode.currentIndex--;
  suppressNextFade = true;
  render();
}

function renderReview() {
  if (!reviewMode) { screen = "results"; render(); return; }
  if (reviewMode.currentIndex >= reviewMode.ids.length) { exitReview(); return; }
  const id = reviewMode.ids[reviewMode.currentIndex];
  const q = QUESTIONS.find(function (x) { return x.id === id; });
  if (!q) { reviewAdvance(); return; }

  const bar = el("div", { class: "header-bar" });
  if (reviewMode.currentIndex > 0) {
    bar.appendChild(el("button", { class: "link", text: "\u2190 Back", onclick: reviewBack }));
  }
  bar.appendChild(el("span", { class: "review-tag", text: "Review mode" }));
  bar.appendChild(el("span", { class: "progress-text", text: "Q " + (reviewMode.currentIndex + 1) + " / " + reviewMode.ids.length }));
  bar.appendChild(el("button", { class: "finish spacer", text: "Done reviewing", onclick: exitReview }));
  app.appendChild(bar);

  const progress = el("div", { class: "progress-bar" });
  progress.appendChild(el("div", { class: "progress-fill", style: "width: " + (((reviewMode.currentIndex + 1) / reviewMode.ids.length) * 100) + "%" }));
  app.appendChild(progress);

  const body = el("div", { class: "question-container" + (suppressNextFade ? "" : " fade-in") });
  suppressNextFade = false;
  body.appendChild(el("div", { class: "situation", text: q.situation }));
  const transcriptEl = el("div", { class: "transcript" });
  transcriptEl.appendChild(renderTranscript(q.transcript));
  body.appendChild(transcriptEl);
  body.appendChild(el("div", { class: "instruction", text: "Where should the highlighted part go?" }));

  const truth = reviewMode.groundTruth[id];
  const userChoice = reviewMode.answers[id];
  const feedback = userChoice !== undefined && userChoice !== null;
  const SOAP_OPT_CLASS = { "Subjective": "opt-subjective", "Objective": "opt-objective", "Assessment": "opt-assessment", "Plan": "opt-plan" };
  const opts = el("div", { class: "options" });
  q.options.forEach(function (opt, i) {
    let cls = "option";
    if (!feedback && SOAP_OPT_CLASS[opt]) cls += " " + SOAP_OPT_CLASS[opt];
    const btn = el("button", {
      class: cls,
      onclick: function () {
        if (feedback) reviewAdvance();
        else { reviewMode.answers[id] = opt; render(); }
      }
    });
    btn.appendChild(el("span", { class: "key-hint", text: String(i + 1) }));
    btn.appendChild(document.createTextNode(opt));
    if (feedback) {
      if (opt === truth) btn.className += " correct";
      else if (opt === userChoice) btn.className += " wrong";
      else btn.className += " muted-opt";
    }
    opts.appendChild(btn);
  });
  body.appendChild(opts);

  if (feedback) {
    if (userChoice === truth) {
      body.appendChild(el("p", { class: "feedback-line correct-line", text: "Correct." }));
    } else {
      const line = el("p", { class: "feedback-line" });
      line.appendChild(document.createTextNode("Correct answer: "));
      line.appendChild(el("strong", { text: truth }));
      body.appendChild(line);
    }
    const nextRow = el("div", { class: "button-row" });
    nextRow.appendChild(el("button", { class: "primary", text: "Next \u2192", onclick: reviewAdvance }));
    body.appendChild(nextRow);
    body.appendChild(el("p", { class: "muted next-hint", text: "Press Enter or Space to continue." }));
  }

  app.appendChild(body);
}

function advance() {
  if (!session) return;
  finalizeTimer();
  pendingDiscardConfirm = false;
  currentIndex = nextLiveIndex(currentIndex + 1, +1);
  if (currentIndex >= session.order.length) screen = "results";
  render();
}

function getResultsTier(percent) {
  if (percent >= 90) return { key: "outstanding", emoji: "\uD83C\uDFC6", side: "\uD83C\uDF89 \u2728 \uD83C\uDF1F", headline: "Outstanding!", caption: "You nailed the edge cases." };
  if (percent >= 75) return { key: "strong", emoji: "\uD83C\uDFAF", side: "\uD83D\uDCAA \u2728", headline: "Strong work!", caption: "Sharp instincts on a tricky set." };
  if (percent >= 60) return { key: "solid", emoji: "\uD83D\uDC4D", side: "\uD83D\uDCD8 \uD83D\uDCA1", headline: "Solid effort.", caption: "A good grasp of the framework." };
  if (percent >= 40) return { key: "growing", emoji: "\uD83D\uDCDA", side: "\uD83E\uDD14 \uD83D\uDCD6", headline: "Room to grow.", caption: "The patterns will click with more reps." };
  return { key: "practice", emoji: "\uD83C\uDF31", side: "\uD83D\uDCAD \uD83C\uDF31", headline: "Keep practicing.", caption: "Every attempt sharpens the eye." };
}

function computeAvgTime() {
  if (!session || !session.times) return null;
  let total = 0, n = 0;
  session.order.forEach(function (id) {
    const t = session.times[id];
    if (typeof t !== "number" || t <= 0) return;
    const ans = session.answers[id];
    if (ans === undefined) return;
    total += t;
    n++;
  });
  if (n === 0) return null;
  return Math.round((total / n) * 10) / 10;
}

function renderCelebrationCard() {
  const sessionIds = new Set(session.order);
  let answered = 0, skipped = 0;
  session.order.forEach(function (id) {
    if (!Object.prototype.hasOwnProperty.call(session.answers, id)) return;
    if (session.answers[id] === null) skipped++;
    else answered++;
  });
  const total = session.order.length;
  const avgTime = computeAvgTime();

  if (!session.groundTruth) {
    const card = el("div", { class: "celebration tier-neutral" });
    card.appendChild(el("div", { class: "celeb-emoji", text: "\u2705" }));
    card.appendChild(el("div", { class: "celeb-headline", text: "Session complete" }));
    card.appendChild(el("div", { class: "celeb-score", text: answered + " / " + total }));
    card.appendChild(el("div", { class: "celeb-percent", text: "questions answered" + (skipped > 0 ? " \u00b7 " + skipped + " skipped" : "") + (avgTime !== null ? " \u00b7 Avg: " + avgTime.toFixed(1) + " s per question" : "") }));
    card.appendChild(el("div", { class: "celeb-caption", text: "Thanks for playing, " + session.player + "." }));
    return card;
  }

  const score = computeScore();
  if (!score || score.answeredWithTruth === 0) {
    const card = el("div", { class: "celebration tier-neutral" });
    card.appendChild(el("div", { class: "celeb-emoji", text: "\uD83D\uDCED" }));
    card.appendChild(el("div", { class: "celeb-headline", text: "No scored answers" }));
    card.appendChild(el("div", { class: "celeb-caption", text: "No answered questions had a ground-truth entry." }));
    return card;
  }

  const tier = getResultsTier(score.percent);
  const card = el("div", { class: "celebration tier-" + tier.key });
  const emoji = el("div", { class: "celeb-emoji bob", text: tier.emoji });
  card.appendChild(emoji);
  card.appendChild(el("div", { class: "celeb-side", text: tier.side }));
  card.appendChild(el("div", { class: "celeb-headline", text: tier.headline }));
  card.appendChild(el("div", { class: "celeb-score", text: score.correct + " / " + score.answeredWithTruth }));
  card.appendChild(el("div", { class: "celeb-percent", text: score.percent + "% correct" }));

  const diffBuckets = { easy: { correct: 0, total: 0 }, medium: { correct: 0, total: 0 }, hard: { correct: 0, total: 0 } };
  const gt = session.groundTruth;
  QUESTIONS.forEach(function (q) {
    if (!Object.prototype.hasOwnProperty.call(gt, q.id)) return;
    const ans = session.answers[q.id];
    if (ans === undefined || ans === null) return;
    if (!diffBuckets[q.difficulty]) return;
    diffBuckets[q.difficulty].total++;
    if (ans === gt[q.id]) diffBuckets[q.difficulty].correct++;
  });
  const pills = el("div", { class: "celeb-pills" });
  VALID_DIFFICULTIES.forEach(function (d) {
    const b = diffBuckets[d];
    const pill = el("span", { class: "celeb-pill diff-" + d + (b.total === 0 ? " dim" : ""), text: DIFFICULTY_LABELS[d] + " " + b.correct + "/" + b.total });
    pills.appendChild(pill);
  });
  card.appendChild(pills);

  if (avgTime !== null) {
    card.appendChild(el("div", { class: "celeb-percent", text: "Avg: " + avgTime.toFixed(1) + " s per question" }));
  }
  card.appendChild(el("div", { class: "celeb-caption", text: tier.caption }));
  return card;
}

function renderMode1ResultsList() {
  if (!session) return;
  const ids = (session.order || []).slice().sort(function (a, b) { return a - b; });
  Object.keys(session.destroyed || {}).forEach(function (k) {
    const id = +k;
    if (ids.indexOf(id) === -1) ids.push(id);
  });
  // Hide source-discarded questions from the results UI even if they appear in
  // the cached order from a session built before the annotation was added.
  for (let i = ids.length - 1; i >= 0; i--) {
    if (isSourceDiscarded(ids[i])) ids.splice(i, 1);
  }
  ids.sort(function (a, b) { return a - b; });
  const wrap = el("div", { class: "mode1-results-list" });
  wrap.appendChild(el("h2", { text: "All questions" }));
  wrap.appendChild(el("p", { class: "muted", text: "Click any row to inspect or edit. Changes save automatically." }));
  ids.forEach(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) return;
    wrap.appendChild(renderMode1ResultRow(q));
  });
  app.appendChild(wrap);
}

function renderMode1ResultRow(q) {
  const id = q.id;
  const isExpanded = expandedResultsId === id;
  const destroyed = isDestroyed(id);
  const ans = session.answers[id];
  const hasAns = ans !== null && ans !== undefined;
  const uncertain = !!(session.uncertain && session.uncertain[id]);
  const note = (session.notes && typeof session.notes[id] === "string") ? session.notes[id] : "";

  const item = el("div", { class: "mode1-row" + (destroyed ? " destroyed" : "") + (isExpanded ? " expanded" : "") });

  const summary = el("div", {
    class: "mode1-row-summary",
    onclick: function () {
      expandedResultsId = (expandedResultsId === id) ? null : id;
      render();
    }
  });
  summary.appendChild(el("span", { class: "mode1-row-id", text: "#" + id }));
  summary.appendChild(el("span", { class: "mode1-row-cat", text: q.category }));
  summary.appendChild(el("span", { class: "mode1-row-diff diff-tag diff-" + q.difficulty, text: DIFFICULTY_LABELS[q.difficulty] }));
  const sit = q.situation || "";
  summary.appendChild(el("span", { class: "mode1-row-sit", text: sit.length > 70 ? sit.slice(0, 67) + "\u2026" : sit }));
  const ansLabel = destroyed ? "Discarded" : (hasAns ? ans : "Skipped");
  summary.appendChild(el("span", { class: "mode1-row-arrow", text: "\u2192" }));
  summary.appendChild(el("span", { class: "mode1-row-ans" + (destroyed ? " row-discarded" : (hasAns ? "" : " row-skipped")), text: ansLabel }));
  if (uncertain && !destroyed) summary.appendChild(el("span", { class: "mode1-row-flag", text: " ?" }));
  if (note && note.trim() !== "") summary.appendChild(el("span", { class: "mode1-row-note-dot", title: "Has note", text: " \u270e" }));
  item.appendChild(summary);

  const sourceNote = sourceNoteFor(id);
  if (sourceNote) {
    item.appendChild(el("div", { class: "mode1-row-source-note", text: "Author note: " + sourceNote }));
  }

  if (isExpanded) {
    const det = el("div", { class: "mode1-row-detail" });
    const tEl = el("div", { class: "transcript" });
    tEl.appendChild(renderTranscript(q.transcript));
    det.appendChild(tEl);

    if (destroyed) {
      const restoreRow = el("div", { class: "button-row" });
      const meta = (session.destroyed && session.destroyed[id])
        || (session.identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed && mathieuDraftCache.destroyed[id])
        || null;
      const fromMathieu = session.identity === "frances" && (!session.destroyed || !session.destroyed[id]) && mathieuDraftCache && mathieuDraftCache.destroyed && mathieuDraftCache.destroyed[id];
      restoreRow.appendChild(el("span", { class: "muted", text: (fromMathieu ? "Discarded by Flore & Mathieu" : "Discarded") + (meta && meta.at ? " at " + meta.at : "") }));
      if (!fromMathieu) {
        restoreRow.appendChild(el("button", {
          class: "secondary",
          text: "Restore",
          onclick: function () { restoreQuestion(id); render(); }
        }));
      }
      det.appendChild(restoreRow);
    } else {
      const optsWrap = el("div", { class: "options" + (q.options.length === 2 ? " opts-2" : "") + " mode1-edit-options" });
      q.options.forEach(function (opt) {
        const btn = el("button", {
          class: "option" + (opt === ans ? " mode1-selected" : ""),
          onclick: function () {
            const wasNull = !hasAns;
            session.answers[id] = opt;
            if (wasNull) playSessionAnsweredIds.add(id);
            saveSession();
            flashSaved();
            render();
          }
        });
        btn.appendChild(document.createTextNode(opt));
        optsWrap.appendChild(btn);
      });
      det.appendChild(optsWrap);

      const editRow = el("div", { class: "mode1-edit-controls" });
      const uBtn = el("button", {
        class: "uncertain-toggle" + (uncertain ? " on" : ""),
        text: uncertain ? "? Uncertain" : "? Uncertain",
        onclick: function () { setUncertain(id, !uncertain); render(); }
      });
      editRow.appendChild(uBtn);
      editRow.appendChild(el("button", {
        class: "discard-link",
        text: "Discard",
        onclick: function () {
          markDestroyed(id);
          flashSaved();
          render();
        }
      }));
      if (hasAns) {
        editRow.appendChild(el("button", {
          class: "link",
          text: "Clear answer",
          onclick: function () {
            session.answers[id] = null;
            saveSession();
            flashSaved();
            render();
          }
        }));
      }
      det.appendChild(editRow);

      const noteWrap = el("div", { class: "note-section" });
      noteWrap.appendChild(el("label", { class: "muted", text: "Note" }));
      const ta = el("textarea", { class: "note-textarea", placeholder: "Note for this question (autosaved)", rows: "3" });
      ta.value = note;
      ta.addEventListener("input", function () { scheduleNoteSave(id, ta.value); });
      noteWrap.appendChild(ta);
      det.appendChild(noteWrap);
    }

    item.appendChild(det);
  }
  return item;
}

function renderResults() {
  if (!session) { screen = "landing"; render(); return; }

  const isMode1 = session.mode === "practice_no_truth";
  const sessionIds = new Set(session.order);
  app.appendChild(renderCelebrationCard());

  const actions = el("div", { class: "button-row" });
  actions.appendChild(el("button", { class: "primary", text: "Download as JSON", onclick: downloadJSON }));
  app.appendChild(actions);

  if (isMode1) {
    const navRow = el("div", { class: "button-row" });
    navRow.appendChild(el("button", {
      class: "secondary",
      text: "Back to landing",
      onclick: function () {
        session = null;
        pendingDiscardConfirm = false;
        mode1BarValues = {};
        screen = "landing";
        render();
      }
    }));
    navRow.appendChild(el("button", {
      class: "secondary",
      text: "Continue authoring",
      onclick: function () {
        currentIndex = firstPendingIndexMode1();
        if (currentIndex >= session.order.length) currentIndex = nextLiveIndex(0, +1);
        if (currentIndex >= session.order.length) return;
        pendingDiscardConfirm = false;
        suppressNextFade = true;
        screen = "quiz";
        render();
      }
    }));
    app.appendChild(navRow);
  }

  const restartRow = el("div", { class: "button-row" });
  restartRow.appendChild(el("button", {
    class: "secondary",
    text: "Restart",
    onclick: function () {
      if (!confirm("Clear all saved answers and start over?")) return;
      const wasMode = session ? session.mode : null;
      const wasIdentity = session ? session.identity : null;
      session = null;
      if (wasMode === "practice_no_truth") {
        if (wasIdentity) clearMode1SessionFor(wasIdentity);
      } else {
        clearGenericSession();
      }
      pendingMode = null;
      pendingQuestionSet = "both";
      pendingDifficulties = ["easy", "medium", "hard"];
      pendingRandomize = false;
      dismissedFeedbackFor = new Set();
      reviewMode = null;
      pendingDiscardConfirm = false;
      mode1BarValues = {};
      currentIndex = 0;
      screen = "landing";
      render();
    }
  }));
  app.appendChild(restartRow);

  if (isMode1) {
    renderSessionReportBlock();
    const ownDestroyedCount = Object.keys(session.destroyed || {}).length;
    const sourceDiscardedCount = Object.keys(SOURCE_DISCARDED).length;
    if (ownDestroyedCount > 0 || sourceDiscardedCount > 0) {
      const linkRow = el("div", { class: "button-row" });
      let label;
      if (ownDestroyedCount > 0 && sourceDiscardedCount > 0) {
        label = "View discarded (" + ownDestroyedCount + " session \u00b7 " + sourceDiscardedCount + " source)";
      } else if (ownDestroyedCount > 0) {
        label = "View discarded (" + ownDestroyedCount + ")";
      } else {
        label = "View discarded in source (" + sourceDiscardedCount + ")";
      }
      linkRow.appendChild(el("button", {
        class: "link",
        text: label,
        onclick: function () { discardedModalOpenFor = session.identity || "flore_mathieu"; render(); }
      }));
      app.appendChild(linkRow);
      if (discardedModalOpenFor) renderDiscardedModalFor(discardedModalOpenFor);
    } else if (discardedModalOpenFor) {
      discardedModalOpenFor = null;
    }
    renderMode1ResultsList();
    return;
  }

  if (session.groundTruth) {
    const incorrectIds = [];
    const gt = session.groundTruth;
    const playOrderRev = (session.playOrder || []).filter(function (id) { return session.order.indexOf(id) !== -1; });
    playOrderRev.forEach(function (id) {
      if (!Object.prototype.hasOwnProperty.call(gt, id)) return;
      const ans = session.answers[id];
      if (ans === undefined || ans === null) return;
      if (ans !== gt[id]) incorrectIds.push(id);
    });
    if (incorrectIds.length > 0) {
      const reviewRow = el("div", { class: "button-row" });
      reviewRow.appendChild(el("button", {
        class: "primary",
        text: "Review incorrect (" + incorrectIds.length + " question" + (incorrectIds.length === 1 ? "" : "s") + ")",
        onclick: function () { startReview(incorrectIds); }
      }));
      app.appendChild(reviewRow);
    }
  }

  if (session.groundTruth) renderScoreSections();

  const playOrder = (session.playOrder || []).filter(function (id) { return sessionIds.has(id); });
  const seen = new Set(playOrder);
  const unreached = [];
  session.order.forEach(function (id) { if (!seen.has(id)) unreached.push(id); });
  unreached.sort(function (a, b) { return a - b; });

  function renderItem(id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) return;
    const item = el("div", { class: "results-item" });
    const meta = el("div", { class: "results-meta" });
    meta.appendChild(el("span", { class: "category", text: q.category }));
    meta.appendChild(el("span", { class: "diff-tag diff-" + q.difficulty, text: DIFFICULTY_LABELS[q.difficulty] }));
    item.appendChild(meta);
    item.appendChild(el("div", { class: "situation", text: "#" + q.id + ". " + q.situation }));
    const itemTranscript = el("div", { class: "transcript" });
    itemTranscript.appendChild(renderTranscript(q.transcript));
    item.appendChild(itemTranscript);
    const ul = el("ul", { class: "results-options" });
    const has = Object.prototype.hasOwnProperty.call(session.answers, q.id);
    const choice = has ? session.answers[q.id] : undefined;
    const truth = session.groundTruth ? session.groundTruth[q.id] : undefined;
    q.options.forEach(function (opt) {
      const li = el("li", { text: opt });
      let cls = "";
      if (truth && opt === truth) cls += " truth";
      if (choice === opt) {
        cls += " chosen";
        if (truth && opt !== truth) cls += " wrong";
      }
      if (cls) li.className += cls;
      ul.appendChild(li);
    });
    if (choice === null) ul.appendChild(el("li", { class: "skipped", text: "Skipped" }));
    else if (choice === undefined) ul.appendChild(el("li", { class: "skipped", text: "Not answered" }));
    item.appendChild(ul);
    app.appendChild(item);
  }

  if (playOrder.length > 0) {
    app.appendChild(el("h2", { text: "Questions in play order" }));
    playOrder.forEach(renderItem);
  }

  if (unreached.length > 0) {
    app.appendChild(el("h2", { text: "Not reached (" + unreached.length + ")" }));
    unreached.forEach(renderItem);
  }
}

function renderScoreSections() {
  const gt = session.groundTruth;
  if (session.mode !== "test") {
    const buckets = {};
    QUESTIONS.forEach(function (q) {
      if (!Object.prototype.hasOwnProperty.call(gt, q.id)) return;
      const ans = session.answers[q.id];
      if (ans === undefined || ans === null) return;
      if (!buckets[q.category]) buckets[q.category] = { correct: 0, total: 0 };
      buckets[q.category].total++;
      if (ans === gt[q.id]) buckets[q.category].correct++;
    });
    const categories = Object.keys(buckets);
    if (categories.length > 0) {
      app.appendChild(el("h2", { text: "Breakdown by category" }));
      const table = el("table", { class: "breakdown-table" });
      const thead = el("thead");
      const trh = el("tr");
      trh.appendChild(el("th", { text: "Category" }));
      trh.appendChild(el("th", { text: "Correct / answered with ground truth" }));
      thead.appendChild(trh);
      table.appendChild(thead);
      const tbody = el("tbody");
      categories.sort().forEach(function (cat) {
        const tr = el("tr");
        tr.appendChild(el("td", { text: cat }));
        tr.appendChild(el("td", { text: buckets[cat].correct + " / " + buckets[cat].total }));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      app.appendChild(table);
    }
  }

  const diffBuckets = { easy: { correct: 0, total: 0 }, medium: { correct: 0, total: 0 }, hard: { correct: 0, total: 0 } };
  QUESTIONS.forEach(function (q) {
    if (!Object.prototype.hasOwnProperty.call(gt, q.id)) return;
    const ans = session.answers[q.id];
    if (ans === undefined || ans === null) return;
    if (!diffBuckets[q.difficulty]) return;
    diffBuckets[q.difficulty].total++;
    if (ans === gt[q.id]) diffBuckets[q.difficulty].correct++;
  });
  const totalDiffAnswered = diffBuckets.easy.total + diffBuckets.medium.total + diffBuckets.hard.total;
  if (totalDiffAnswered > 0) {
    app.appendChild(el("h2", { text: "Breakdown by difficulty" }));
    const parts = VALID_DIFFICULTIES.map(function (d) {
      return DIFFICULTY_LABELS[d] + ": " + diffBuckets[d].correct + "/" + diffBuckets[d].total;
    });
    app.appendChild(el("p", { text: parts.join(" \u00b7 ") }));
  }

  const incorrect = [];
  QUESTIONS.forEach(function (q) {
    if (!Object.prototype.hasOwnProperty.call(gt, q.id)) return;
    const ans = session.answers[q.id];
    if (ans === undefined || ans === null) return;
    if (ans !== gt[q.id]) incorrect.push({ q: q, ans: ans, truth: gt[q.id] });
  });
  if (incorrect.length > 0) {
    app.appendChild(el("h2", { text: "Incorrect answers (" + incorrect.length + ")" }));
    incorrect.forEach(function (row) {
      const div = el("div", { class: "incorrect-row" });
      div.appendChild(el("div", { class: "question", text: "#" + row.q.id + ". " + row.q.situation }));
      const t = el("div", { class: "transcript" });
      t.appendChild(renderTranscript(row.q.transcript));
      div.appendChild(t);
      div.appendChild(el("div", { text: "Your choice: " + row.ans }));
      div.appendChild(el("div", { text: "Correct answer: " + row.truth }));
      app.appendChild(div);
    });
  }
}

document.addEventListener("click", function () { trackUserActivity(); }, true);
document.addEventListener("keydown", function (e) {
  trackUserActivity();
  if (e.target) {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.target.isContentEditable) return;
  }
  if (document.querySelector(".modal-overlay")) return;
  if (pendingDiscardConfirm) return;

  if (screen === "quiz" && session) {
    const inFeedback = isFeedbackActive();
    const mode1Post = session.mode === "practice_no_truth" && isMode1Post();
    if (inFeedback || mode1Post) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        advance();
        return;
      }
      if (mode1Post && (e.key === "d" || e.key === "D")) {
        pendingDiscardConfirm = true;
        e.preventDefault();
        render();
        return;
      }
      if (mode1Post) {
        const num = parseInt(e.key, 10);
        if (Number.isInteger(num) && num >= 1 && num <= 9) {
          const q = getQuestion(currentIndex);
          if (!q || num > q.options.length) return;
          e.preventDefault();
          selectAnswer(q.id, q.options[num - 1]);
        }
      }
      return;
    }
    if (session.mode === "practice_no_truth" && (e.key === "d" || e.key === "D")) {
      pendingDiscardConfirm = true;
      e.preventDefault();
      render();
      return;
    }
    const num = parseInt(e.key, 10);
    if (Number.isInteger(num) && num >= 1 && num <= 9) {
      const q = getQuestion(currentIndex);
      if (!q || num > q.options.length) return;
      e.preventDefault();
      selectAnswer(q.id, q.options[num - 1]);
    }
    return;
  }

  if (screen === "review" && reviewMode) {
    const id = reviewMode.ids[reviewMode.currentIndex];
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) return;
    const userChoice = reviewMode.answers[id];
    const inFeedback = userChoice !== undefined && userChoice !== null;
    if (inFeedback) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        reviewAdvance();
      }
      return;
    }
    const num = parseInt(e.key, 10);
    if (Number.isInteger(num) && num >= 1 && num <= 9) {
      if (num > q.options.length) return;
      e.preventDefault();
      reviewMode.answers[id] = q.options[num - 1];
      render();
    }
  }
});

window.addEventListener("beforeunload", finalizeTimer);

render();
</script>
</body>
</html>
