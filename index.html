<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOAP Classification Quiz</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --btn-bg: #ffffff;
    --btn-hover: #f3f4f6;
    --btn-active: #e5e7eb;
    --highlight: #dbeafe;
    --highlight-border: #2563eb;
    --correct-bg: #d1fae5;
    --correct-border: #10b981;
    --correct-fg: #065f46;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-fg: #991b1b;
    --pill-bg: #eef2ff;
    --pill-fg: #3730a3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main {
    max-width: 1024px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }
  body.has-sidebar main { max-width: 1024px; }
  h1 { font-size: 24px; margin: 16px 0 12px; }
  h2 { font-size: 18px; margin: 24px 0 10px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Header bar */
  .header-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .header-bar .progress-text {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .header-bar .pill {
    background: var(--pill-bg);
    color: var(--pill-fg);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .header-bar .spacer { margin-left: auto; }
  .diff-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .header-bar .diff-tag { font-size: 13px; padding: 5px 14px; }
  .diff-easy { background: #a7f3d0; color: #065f46; }
  .diff-medium { background: #fde68a; color: #92400e; }
  .diff-hard { background: #fecaca; color: #991b1b; }
  button.link {
    background: none;
    border: none;
    padding: 4px 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
  }
  button.link:hover { color: var(--fg); text-decoration: underline; }

  /* Infinite-mode header controls (Easier / Harder + End session). */
  .header-bar.infinite-header { gap: 8px; }
  .diff-control {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .diff-control:hover:not(:disabled) { background: var(--btn-hover); border-color: var(--accent); color: var(--accent); }
  .diff-control:focus-visible { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35); }
  .diff-control:disabled { opacity: 0.4; cursor: not-allowed; }
  .header-bar .pill.streak-pill { background: #fef3c7; color: #92400e; }
  button.finish {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button.finish:hover { color: var(--wrong-fg); border-color: #fecaca; background: #fef2f2; }

  /* Inline toast for "Switching to X for the next question". Lives outside
     #app so it never gets re-rendered, fades in/out without disturbing
     layout. */
  #infinite-toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translate(-50%, -8px);
    background: #1f2937;
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #infinite-toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Infinite-mode results card. */
  .infinite-results {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 26px;
    margin: 14px 0 18px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
  }
  .infinite-results h1 { margin: 0 0 4px; font-size: 22px; }
  .infinite-results .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }
  .stat-grid .stat {
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-grid .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-grid .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
  .infinite-results .breakdown {
    display: flex;
    gap: 8px;
    margin: 14px 0 0;
    flex-wrap: wrap;
  }
  .infinite-results .breakdown .celeb-pill { font-size: 13px; padding: 5px 12px; }

  /* Progress bar (segmented) */
  .progress-bar.segmented {
    display: flex;
    gap: 4px;
    height: 8px;
    margin-bottom: 18px;
  }
  .progress-bar.segmented .seg {
    flex: 1;
    border-radius: 3px;
    background: var(--border);
    opacity: 0.45;
  }
  .progress-bar.segmented .seg.seg-easy { background: #6ee7b7; }
  .progress-bar.segmented .seg.seg-medium { background: #fcd34d; }
  .progress-bar.segmented .seg.seg-hard { background: #fca5a5; }
  .progress-bar.segmented .seg.filled { opacity: 1; }

  /* Quiz body */
  .question-container { animation: fade-in 0.18s ease; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .situation {
    color: #4b5563;
    font-size: 15px;
    margin-bottom: 8px;
  }
  .transcript {
    font-size: 17px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .transcript .speaker {
    color: var(--muted);
    margin-right: 4px;
  }
  .transcript mark {
    background: transparent;
    color: #0b6b3a;
    font-weight: 700;
    padding: 0;
  }
  .instruction {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .options.opts-2 {
    flex-direction: row;
  }
  .options.opts-2 button.option { flex: 1; }
  @media (max-width: 600px) {
    .options.opts-2 { flex-direction: column; }
  }
  /* ---------------------------------------------------------------------
   * Option buttons.
   *
   * Click-reliability rules (do not violate):
   *   - The button's intrinsic box (width / height / padding / border-width /
   *     font-weight / margin) MUST be identical across every state:
   *     default, hover, focus, active, .correct, .wrong, .muted-opt.
   *     Anything that changes the box size makes the button shift out from
   *     under the cursor mid-click and drops the click.
   *   - Hover decorations like the "→ Next" hint are positioned absolutely
   *     and use pointer-events: none so they neither shift layout nor
   *     swallow clicks.
   *   - Focus rings use box-shadow, not outline / border-width changes.
   *   - touch-action: manipulation removes the 300ms mobile tap delay.
   * --------------------------------------------------------------------- */
  button.option {
    width: 100%;
    min-height: 52px;
    text-align: left;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 500;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    color: var(--fg);
    position: relative;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, opacity 0.12s;
  }
  button.option:hover { background: var(--btn-hover); border-color: var(--accent); }
  button.option:active { background: var(--btn-active); }
  button.option:focus-visible { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35); }
  button.option:disabled { cursor: default; }
  .key-hint {
    display: inline-block;
    margin-right: 10px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* SOAP color coding (4-option questions only) */
  button.option.opt-subjective { border-left: 4px solid #2563eb; background: rgba(37, 99, 235, 0.05); }
  button.option.opt-objective  { border-left: 4px solid #059669; background: rgba(5, 150, 105, 0.05); }
  button.option.opt-assessment { border-left: 4px solid #7c3aed; background: rgba(124, 58, 237, 0.05); }
  button.option.opt-plan       { border-left: 4px solid #d97706; background: rgba(217, 119, 6, 0.06); }

  /* Feedback state: locked colors, hover ring */
  button.option.correct, button.option.correct:hover, button.option.correct:focus {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-fg);
  }
  button.option.wrong, button.option.wrong:hover, button.option.wrong:focus {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-fg);
  }
  button.option.muted-opt, button.option.muted-opt:hover, button.option.muted-opt:focus {
    opacity: 0.6;
    background: var(--btn-bg);
    border-color: var(--border);
  }
  .options:has(button.correct) button.option:hover {
    box-shadow: 0 0 0 2px rgba(0,0,0,0.12);
  }
  .options:has(button.correct) button.option.correct:hover { box-shadow: 0 0 0 2px #059669; }
  .options:has(button.correct) button.option.wrong:hover   { box-shadow: 0 0 0 2px #b91c1c; }
  .options:has(button.correct) button.option:hover::after {
    content: "\2192 Next";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }
  .feedback-line { font-size: 15px; margin: 8px 0 12px; }
  .feedback-line.correct-line { color: var(--correct-fg); font-weight: 600; }
  .next-hint { color: var(--muted); font-size: 13px; }

  /* Skip link */
  .skip-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  .button-row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }

  /* Test layout with sidebar */
  body.has-sidebar main { display: block; }
  .test-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 28px;
    align-items: start;
  }
  .test-main { min-width: 0; }
  .test-sidebar {
    position: sticky;
    top: 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
  }
  .test-sidebar-title {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .soap-node {
    border-left: 3px solid transparent;
    padding: 6px 0 6px 10px;
    margin-bottom: 6px;
    border-radius: 0 6px 6px 0;
  }
  .soap-node.soap-blue   { border-left-color: #2563eb; }
  .soap-node.soap-green  { border-left-color: #059669; }
  .soap-node.soap-purple { border-left-color: #7c3aed; }
  .soap-node.soap-orange { border-left-color: #d97706; }
  .soap-node .soap-name { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
  .sub-list { list-style: none; padding: 4px 0 0 0; margin: 0; }
  .sub-node {
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .sub-node.hover { background: #fef3c7; color: #1f2937; }
  .soap-node.hover-parent { background: rgba(0,0,0,0.025); }

  @media (max-width: 900px) {
    .test-layout { grid-template-columns: 1fr; }
    .test-sidebar { position: static; }
  }

  /* Celebration card */
  .celebration {
    text-align: center;
    padding: 32px 24px;
    border-radius: 16px;
    margin: 12px 0 28px;
    color: #1a1a1a;
  }
  .celebration.tier-outstanding { background: linear-gradient(135deg, #fef3c7, #fdba74); }
  .celebration.tier-strong      { background: linear-gradient(135deg, #d1fae5, #6ee7b7); }
  .celebration.tier-solid       { background: linear-gradient(135deg, #dbeafe, #93c5fd); }
  .celebration.tier-growing     { background: linear-gradient(135deg, #e5e7eb, #cbd5e1); }
  .celebration.tier-practice    { background: linear-gradient(135deg, #fef3c7, #fde68a); }
  .celeb-emoji { font-size: 56px; line-height: 1; margin-bottom: 6px; }
  .celeb-emoji.bob { animation: bob 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .celeb-side { font-size: 22px; margin-bottom: 6px; }
  .celeb-headline { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .celeb-score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .celeb-percent { font-size: 14px; color: #4b5563; margin-bottom: 14px; }
  .celeb-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .celeb-pill {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .celeb-pill.dim { opacity: 0.45; }
  .celeb-caption { font-size: 14px; color: #374151; }

  /* Per-question recap */
  .results-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: white;
  }
  .results-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .results-meta .category {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .results-options {
    list-style: none;
    padding: 0;
    margin: 8px 0 0;
  }
  .results-options li {
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    font-size: 14px;
  }
  .results-options li.truth {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-fg);
  }
  .results-options li.chosen.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-fg);
  }
  .results-options li.skipped {
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<div id="infinite-toast" role="status" aria-live="polite"></div>
<main id="app"></main>
<script>
"use strict";

// =====================================================================
// QUESTIONS
// ---------------------------------------------------------------------
// 144 questions total (28 source-discarded). The 116 active questions
// are sampled from for the Test mode session.
// Each question carries an optional `discarded: true` flag at the source level.
// =====================================================================
const QUESTIONS = [
  {"id": 1, "set": "subsection", "difficulty": "medium", "category": "Chief Complaint vs. History of Present Illness", "situation": "Multiple complaints of unequal weight", "transcript": "Patient: I'm here for my diabetes follow-up, but also **my knee has been killing me**.", "options": ["Chief Complaint", "History of Present Illness"]},
  {"id": 2, "set": "subsection", "difficulty": "medium", "category": "Chief Complaint vs. History of Present Illness", "situation": "Stated reason isn't the real one", "transcript": "Patient: I booked this for a medication refill, but honestly **I've been having chest pain for three days**.", "options": ["Chief Complaint", "History of Present Illness"]},
  {"id": 3, "set": "subsection", "difficulty": "medium", "category": "Chief Complaint vs. History of Present Illness", "situation": "Asymptomatic visit, no complaint", "transcript": "Patient: **I'm here for my annual physical**, nothing's really wrong.", "options": ["Chief Complaint", "History of Present Illness", "Appointments"]},
  {"id": 4, "set": "subsection", "difficulty": "hard", "category": "Chief Complaint vs. History of Present Illness", "situation": "Screening positive triggered the visit", "transcript": "Patient: The lab called and said **my TSH came back high**, so they told me to come in.", "options": ["Chief Complaint", "History of Present Illness", "Lab Results"]},
  {"id": 5, "set": "subsection", "difficulty": "medium", "category": "History of Present Illness vs. Past Medical History", "situation": "Chronic condition presenting acutely", "transcript": "Patient: I've had **asthma since I was a kid**, and right now I can't catch my breath.", "options": ["History of Present Illness", "Past Medical History"]},
  {"id": 6, "set": "subsection", "difficulty": "medium", "category": "History of Present Illness vs. Past Medical History", "situation": "Recurrence of a past problem", "transcript": "Patient: It burns when I pee again — this is **my third UTI this year**.", "options": ["History of Present Illness", "Past Medical History"]},
  {"id": 7, "set": "subsection", "difficulty": "hard", "category": "History of Present Illness vs. Past Medical History", "situation": "Recent admission for the same issue", "transcript": "Patient: The shortness of breath is back. **I was hospitalized for this exact thing four days ago** and discharged Tuesday.", "options": ["History of Present Illness", "Past Medical History"]},
  {"id": 8, "set": "subsection", "difficulty": "medium", "category": "Past Medical History vs. other history", "situation": "Pregnancy-related medical condition", "transcript": "Patient: With my second pregnancy I had **gestational diabetes that resolved after delivery**.", "options": ["Past Medical History", "Past Obstetric History"]},
  {"id": 9, "set": "subsection", "difficulty": "medium", "category": "Past Medical History vs. other history", "situation": "Reason behind a past surgery", "transcript": "Patient: They took my gallbladder out in 2019 because **I kept getting gallstones**.", "options": ["Past Medical History", "Past Surgical History"]},
  {"id": 10, "set": "subsection", "difficulty": "hard", "category": "Past Medical History vs. other history", "situation": "Past suicide attempt", "transcript": "Patient: I should mention — **I attempted suicide about five years ago**, I was hospitalized for a week.", "options": ["Past Medical History", "Social History"]},
  {"id": 11, "set": "subsection", "difficulty": "medium", "category": "Past Medical History vs. other history", "situation": "Active substance use disorder", "transcript": "Patient: I want to be honest, **I've been drinking heavily for about two years now**, almost daily.", "options": ["Past Medical History", "Social History"]},
  {"id": 12, "set": "subsection", "difficulty": "medium", "category": "Obstetric History edges", "situation": "Pregnancy loss / ectopic", "transcript": "Patient: Before my son, **I had an ectopic pregnancy in 2018 that ruptured**.", "options": ["Past Obstetric History", "Past Medical History"]},
  {"id": 13, "set": "subsection", "difficulty": "medium", "category": "Obstetric History edges", "situation": "Currently pregnant", "transcript": "Patient: **I'm 22 weeks pregnant right now**, that's actually why I'm here.", "options": ["Past Obstetric History", "History of Present Illness"]},
  {"id": 14, "set": "subsection", "difficulty": "hard", "category": "Obstetric History edges", "situation": "Trans man with prior pregnancies", "transcript": "Patient: Before I transitioned, **I gave birth to two children, in 2011 and 2014**.", "options": ["Past Obstetric History", "Past Medical History"]},
  {"id": 15, "set": "subsection", "difficulty": "hard", "category": "Obstetric History edges", "situation": "Partner's obstetric history", "transcript": "Patient: We're trying again, but **my wife's last pregnancy was a trisomy 18 and ended at 16 weeks**.", "options": ["Family History", "Past Obstetric History"]},
  {"id": 16, "set": "subsection", "difficulty": "medium", "category": "Family History", "situation": "Adopted, biological family unknown", "transcript": "Patient: I was adopted at birth, so **I don't know anything about my biological family's medical history**.", "options": ["Family History", "Social History"]},
  {"id": 17, "set": "subsection", "difficulty": "medium", "category": "Family History", "situation": "Family of choice vs. biological", "transcript": "Patient: When you ask about family — **my step-brother had colon cancer at 45**, but we're not blood related.", "options": ["Family History", "Social History"]},
  {"id": 18, "set": "subsection", "difficulty": "medium", "category": "Family History", "situation": "Deceased relative, cause unknown", "transcript": "Patient: **My father died at 42**, but nobody ever told me what from.", "options": ["Family History", "Past Medical History"]},
  {"id": 19, "set": "subsection", "difficulty": "hard", "category": "Family History", "situation": "Relative's genetic test result", "transcript": "Patient: My oncologist wants me screened earlier because **my sister tested positive for BRCA1 last year**.", "options": ["Family History", "Lab Results"]},
  {"id": 20, "set": "subsection", "difficulty": "medium", "category": "Social History", "situation": "Occupational exposure relevant now", "transcript": "Patient: I've been a machinist for thirty years, and **I worked around metal dust and coolant mist the whole time**.", "options": ["Social History", "History of Present Illness"]},
  {"id": 21, "set": "subsection", "difficulty": "medium", "category": "Social History", "situation": "Sexual exposure in STI workup", "transcript": "Patient: I came in because of the discharge — **I had unprotected sex with a new partner about ten days ago**.", "options": ["Social History", "History of Present Illness"]},
  {"id": 22, "set": "subsection", "difficulty": "hard", "category": "Social History", "situation": "Intimate partner violence disclosed", "transcript": "Patient: I haven't told anyone this, but **my husband has been hitting me for the past few months**.", "options": ["Social History", "History of Present Illness"]},
  {"id": 23, "set": "subsection", "difficulty": "hard", "category": "Social History", "situation": "Lifestyle factors in chronic disease", "transcript": "Patient: For my diabetes — **I walk about 30 minutes most days and I've cut out soda**.", "options": ["Social History", "Assessment"]},

const SOURCE_DISCARDED = (function () {
  const set = Object.create(null);
  QUESTIONS.forEach(function (q) { if (q && q.discarded === true) set[q.id] = true; });
  return set;
})();
function isSourceDiscarded(id) { return !!SOURCE_DISCARDED[id]; }

(function validateOnLoad() {
  let total = 0, active = 0, sourceDiscarded = 0;
  QUESTIONS.forEach(function (q) {
    total++;
    if (!q || !Array.isArray(q.options) || typeof q.transcript !== "string" || q.transcript === "") {
      throw new Error("Question " + (q && q.id) + " is missing options or transcript");
    }
    if (isSourceDiscarded(q.id)) sourceDiscarded++; else active++;
  });
  console.info("Loaded " + total + " questions, " + active + " active, " + sourceDiscarded + " source-discarded.");
  let valid = 0, mismatched = 0, unknown = 0;
  for (const key in GROUND_TRUTH) {
    if (!Object.prototype.hasOwnProperty.call(GROUND_TRUTH, key)) continue;
    const id = +key;
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) { unknown++; console.error("GROUND_TRUTH unknown id " + key); continue; }
    if (q.options.indexOf(GROUND_TRUTH[key]) === -1) {
      mismatched++;
      console.error("GROUND_TRUTH mismatch for id " + key);
      continue;
    }
    valid++;
  }
  console.info("Ground truth: " + valid + " valid, " + mismatched + " mismatched, " + unknown + " unknown.");
})();

// --- Helpers -----------------------------------------------------------------
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) node.setAttribute(k, "");
      else if (attrs[k] === false || attrs[k] == null) { /* skip */ }
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(function (c) { if (c) node.appendChild(c); });
  return node;
}

function renderTranscript(text) {
  const frag = document.createDocumentFragment();
  let rest = text || "";
  const speakerMatch = rest.match(/^([^:\n]{1,80}:)\s*/);
  if (speakerMatch) {
    const sp = document.createElement("span");
    sp.className = "speaker";
    sp.textContent = speakerMatch[1];
    frag.appendChild(sp);
    rest = rest.slice(speakerMatch[0].length);
  }
  const parts = rest.split(/(\*\*[^*]+\*\*)/);
  parts.forEach(function (p) {
    if (!p) return;
    if (p.length >= 4 && p.slice(0, 2) === "**" && p.slice(-2) === "**") {
      const m = document.createElement("mark");
      m.textContent = p.slice(2, -2);
      frag.appendChild(m);
    } else {
      frag.appendChild(document.createTextNode(p));
    }
  });
  return frag;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// --- Test sequence -----------------------------------------------------------
function poolForBand(difficulty) {
  return QUESTIONS.filter(function (q) {
    if (isSourceDiscarded(q.id)) return false;
    if (q.difficulty !== difficulty) return false;
    if (!Object.prototype.hasOwnProperty.call(GROUND_TRUTH, q.id)) return false;
    return true;
  });
}

function buildTestSequence() {
  const seq = [];
  TEST_SEQUENCE_ORDER.forEach(function (d) {
    const pool = poolForBand(d);
    const ids = shuffle(pool.map(function (q) { return q.id; }));
    Array.prototype.push.apply(seq, ids.slice(0, TEST_SEQUENCE_SHAPE[d]));
  });
  return seq;
}

// --- Session management ------------------------------------------------------
function startNewSession() {
  const order = buildTestSequence();
  session = {
    mode: "test",
    order: order,
    playOrder: [],
    answers: {},
    groundTruth: GROUND_TRUTH,
    startedAt: new Date().toISOString()
  };
  currentIndex = 0;
  dismissedFeedbackFor = new Set();
  suppressNextFade = true;
  screen = "quiz";
  render();
}

// Infinite mode: an open-ended drill-style session.
//   - Pulls one question at a time from a per-difficulty bag (shuffled list
//     of all eligible ids; refilled when empty so questions don't repeat
//     until the whole pool has been seen).
//   - Difficulty is mutable mid-session via the header controls; changes
//     take effect on the next question, never rewriting the current one.
//   - All state lives in memory only — refreshing the page returns to the
//     5-question test.
function startInfiniteSession(initialDifficulty) {
  const d = (VALID_DIFFICULTIES.indexOf(initialDifficulty) !== -1) ? initialDifficulty : "medium";
  session = {
    mode: "infinite",
    difficulty: d,
    bags: { easy: [], medium: [], hard: [] },
    answers: {},
    playOrder: [],
    history: [],
    correctCount: 0,
    totalAnswered: 0,
    streak: 0,
    bestStreak: 0,
    totalTimeMs: 0,
    questionStartedAt: 0,
    currentQid: null,
    groundTruth: GROUND_TRUTH,
    startedAt: new Date().toISOString()
  };
  drawNextInfiniteQuestion();
  currentIndex = 0;
  dismissedFeedbackFor = new Set();
  suppressNextFade = true;
  screen = "quiz";
  render();
}

function drawNextInfiniteQuestion() {
  if (!session || session.mode !== "infinite") return;
  const d = session.difficulty;
  if (!session.bags[d] || session.bags[d].length === 0) {
    session.bags[d] = shuffle(poolForBand(d).map(function (q) { return q.id; }));
  }
  session.currentQid = session.bags[d].pop();
  session.questionStartedAt = Date.now();
  // The bag refills once exhausted, so a question can come around for a
  // second pass. Clear any prior "dismissed feedback" flag so the user
  // sees feedback again on this fresh attempt.
  if (session.currentQid != null) dismissedFeedbackFor.delete(session.currentQid);
  if (session.currentQid != null && session.playOrder.indexOf(session.currentQid) === -1) {
    session.playOrder.push(session.currentQid);
  }
}

function stepDifficulty(d, dir) {
  const order = ["easy", "medium", "hard"];
  const i = order.indexOf(d);
  if (i === -1) return d;
  const j = i + dir;
  if (j < 0 || j >= order.length) return d;
  return order[j];
}

function setInfiniteDifficulty(newDiff) {
  if (!session || session.mode !== "infinite") return;
  if (newDiff === session.difficulty) return;
  if (VALID_DIFFICULTIES.indexOf(newDiff) === -1) return;
  session.difficulty = newDiff;
  showInfiniteToast("Switching to " + DIFFICULTY_LABELS[newDiff].toLowerCase() + " for the next question.");
  render();
}

let _infiniteToastTimer = null;
function showInfiniteToast(msg) {
  const t = document.getElementById("infinite-toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  if (_infiniteToastTimer) clearTimeout(_infiniteToastTimer);
  _infiniteToastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
}

function endInfiniteSession() {
  if (!session || session.mode !== "infinite") return;
  screen = "infinite-results";
  render();
}

function continueInfiniteSession() {
  if (!session || session.mode !== "infinite") return;
  if (session.currentQid == null) drawNextInfiniteQuestion();
  suppressNextFade = true;
  screen = "quiz";
  render();
}

function pickInfiniteStartDifficulty(percent) {
  if (percent >= 75) return "hard";
  if (percent >= 40) return "medium";
  return "easy";
}

function getQuestion(idx) {
  if (!session || idx < 0 || !session.order || idx >= session.order.length) return null;
  const id = session.order[idx];
  return QUESTIONS.find(function (q) { return q.id === id; });
}

function getCurrentQuestion() {
  if (!session) return null;
  if (session.mode === "infinite") {
    return session.currentQid != null ? QUESTIONS.find(function (q) { return q.id === session.currentQid; }) : null;
  }
  return getQuestion(currentIndex);
}

function isFeedbackActive() {
  if (!session || !session.groundTruth) return false;
  const q = getCurrentQuestion();
  if (!q) return false;
  if (dismissedFeedbackFor.has(q.id)) return false;
  if (!Object.prototype.hasOwnProperty.call(session.groundTruth, q.id)) return false;
  const ans = session.answers[q.id];
  return ans !== undefined && ans !== null;
}

function computeScore() {
  if (!session || !session.groundTruth) return null;
  let correct = 0, answeredWithTruth = 0;
  for (const id in session.answers) {
    const ans = session.answers[id];
    if (ans === null || ans === undefined) continue;
    if (!Object.prototype.hasOwnProperty.call(session.groundTruth, id)) continue;
    answeredWithTruth++;
    if (ans === session.groundTruth[id]) correct++;
  }
  const percent = answeredWithTruth > 0 ? Math.round((correct / answeredWithTruth) * 1000) / 10 : 0;
  return { correct: correct, answeredWithTruth: answeredWithTruth, percent: percent };
}

function selectAnswer(id, choice) {
  if (!session) return;
  // In infinite mode, record the user's pick on the question's intrinsic
  // difficulty (NOT the header's possibly-changed difficulty), update
  // running stats, then re-render to show feedback.
  if (session.mode === "infinite") {
    if (choice === null) { advance(); return; }
    const q = QUESTIONS.find(function (qq) { return qq.id === id; });
    if (!q) return;
    session.answers[id] = choice;
    const truth = session.groundTruth[id];
    const correct = (choice === truth);
    const ms = session.questionStartedAt ? Math.max(0, Date.now() - session.questionStartedAt) : 0;
    session.history.push({ id: id, choice: choice, correct: correct, difficulty: q.difficulty, ms: ms });
    session.totalAnswered++;
    session.totalTimeMs += ms;
    if (correct) {
      session.correctCount++;
      session.streak++;
      if (session.streak > session.bestStreak) session.bestStreak = session.streak;
    } else {
      session.streak = 0;
    }
    render();
    return;
  }
  session.answers[id] = choice;
  if (choice === null) {
    advance();
    return;
  }
  const hasGT = session.groundTruth && Object.prototype.hasOwnProperty.call(session.groundTruth, id);
  if (hasGT) {
    render();
  } else {
    advance();
  }
}

function advance() {
  if (!session) return;
  if (session.mode === "infinite") {
    const cur = getCurrentQuestion();
    if (cur) dismissedFeedbackFor.add(cur.id);
    drawNextInfiniteQuestion();
    suppressNextFade = false;
    render();
    return;
  }
  const q = getQuestion(currentIndex);
  if (q) dismissedFeedbackFor.add(q.id);
  currentIndex++;
  suppressNextFade = false;
  if (currentIndex >= session.order.length) {
    screen = "results";
  }
  render();
}

function back() {
  if (!session || session.mode !== "test") return;
  if (currentIndex === 0) return;
  currentIndex--;
  suppressNextFade = true;
  const prev = getQuestion(currentIndex);
  if (prev) dismissedFeedbackFor.delete(prev.id);
  render();
}

// --- Sidebar -----------------------------------------------------------------
function renderSidebar(currentSet) {
  const sidebar = el("aside", { class: "test-sidebar" });
  sidebar.appendChild(el("div", { class: "test-sidebar-title", text: "SOAP framework" }));
  SOAP_TREE.forEach(function (node) {
    const block = el("div", { class: "soap-node soap-" + node.color });
    block.setAttribute("data-soap-node", node.name);
    block.appendChild(el("div", { class: "soap-name", text: node.name }));
    if (currentSet === "subsection") {
      const list = el("ul", { class: "sub-list" });
      node.subs.forEach(function (sub) {
        const li = el("li", { class: "sub-node", text: sub });
        li.setAttribute("data-sub-node", sub);
        list.appendChild(li);
      });
      block.appendChild(list);
    }
    sidebar.appendChild(block);
  });
  return sidebar;
}

function highlightSidebarFor(opt) {
  clearSidebarHighlight();
  const sub = OPTION_TO_SUB[opt];
  if (!sub) return;
  const subEl = document.querySelector('[data-sub-node="' + sub + '"]');
  if (subEl) subEl.classList.add("hover");
  const soap = SUB_TO_SOAP[sub];
  if (soap) {
    const soapEl = document.querySelector('[data-soap-node="' + soap + '"]');
    if (soapEl) soapEl.classList.add("hover-parent");
  }
}

function clearSidebarHighlight() {
  const subs = document.querySelectorAll(".sub-node.hover");
  for (let i = 0; i < subs.length; i++) subs[i].classList.remove("hover");
  const tops = document.querySelectorAll(".soap-node.hover-parent");
  for (let i = 0; i < tops.length; i++) tops[i].classList.remove("hover-parent");
}

// --- Header ------------------------------------------------------------------
function renderHeaderBar() {
  if (session && session.mode === "infinite") return renderInfiniteHeader();

  const bar = el("div", { class: "header-bar" });

  if (currentIndex > 0) {
    bar.appendChild(el("button", { class: "link", text: "\u2190 Back", onclick: back }));
  }

  bar.appendChild(el("span", { class: "progress-text", text: "Q " + (currentIndex + 1) + " / " + session.order.length }));

  const q = getQuestion(currentIndex);
  if (q) {
    bar.appendChild(el("span", { class: "diff-tag diff-" + q.difficulty, text: DIFFICULTY_LABELS[q.difficulty] }));
  }

  const score = computeScore();
  if (score) {
    const pill = el("span", { class: "pill spacer", text: "Score: " + score.correct + " / " + score.answeredWithTruth });
    bar.appendChild(pill);
  }

  return bar;
}

function renderInfiniteHeader() {
  const bar = el("div", { class: "header-bar infinite-header" });

  const cur = session.difficulty;
  const easyBtn = el("button", {
    class: "diff-control",
    text: "\u2190 Easier",
    onclick: function () { setInfiniteDifficulty(stepDifficulty(cur, -1)); }
  });
  if (cur === "easy") easyBtn.disabled = true;
  bar.appendChild(easyBtn);

  bar.appendChild(el("span", { class: "diff-tag diff-" + cur, text: DIFFICULTY_LABELS[cur] }));

  const hardBtn = el("button", {
    class: "diff-control",
    text: "Harder \u2192",
    onclick: function () { setInfiniteDifficulty(stepDifficulty(cur, +1)); }
  });
  if (cur === "hard") hardBtn.disabled = true;
  bar.appendChild(hardBtn);

  bar.appendChild(el("span", {
    class: "pill spacer",
    text: "Correct: " + session.correctCount + " / " + session.totalAnswered
  }));
  bar.appendChild(el("span", {
    class: "pill streak-pill",
    text: "Streak: " + session.streak
  }));
  bar.appendChild(el("button", {
    class: "finish",
    text: "End session",
    onclick: endInfiniteSession
  }));

  return bar;
}

function renderProgressBar() {
  const bar = el("div", { class: "progress-bar segmented" });
  session.order.forEach(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    const diff = q ? q.difficulty : "medium";
    const filled = Object.prototype.hasOwnProperty.call(session.answers, id);
    bar.appendChild(el("div", { class: "seg seg-" + diff + (filled ? " filled" : "") }));
  });
  return bar;
}

// --- Quiz screen -------------------------------------------------------------
function renderQuiz() {
  if (!session) { startNewSession(); return; }
  if (session.mode === "test" && currentIndex >= session.order.length) { screen = "results"; render(); return; }
  // Make sure infinite mode always has a current question loaded.
  if (session.mode === "infinite" && session.currentQid == null) drawNextInfiniteQuestion();
  const q = getCurrentQuestion();
  if (!q) return;

  if (session.mode === "test") {
    if (!session.playOrder) session.playOrder = [];
    if (session.playOrder.indexOf(q.id) === -1) session.playOrder.push(q.id);
  }

  const feedback = isFeedbackActive();

  app.appendChild(renderHeaderBar());

  const layout = el("div", { class: "test-layout" });
  const main = el("div", { class: "test-main" });
  layout.appendChild(main);
  layout.appendChild(renderSidebar(q.set));
  app.appendChild(layout);

  if (session.mode === "test") main.appendChild(renderProgressBar());

  const body = el("div", { class: "question-container" + (suppressNextFade ? "" : " fade-in") });
  suppressNextFade = false;

  body.appendChild(el("div", { class: "situation", text: q.situation }));
  const transcriptEl = el("div", { class: "transcript" });
  transcriptEl.appendChild(renderTranscript(q.transcript));
  body.appendChild(transcriptEl);
  body.appendChild(el("div", { class: "instruction", text: "Where should the highlighted part go?" }));

  const userChoice = session.answers[q.id];
  const truth = session.groundTruth && session.groundTruth[q.id];
  const wireHover = q.set === "subsection";

  const SOAP_OPT_CLASS = { "Subjective": "opt-subjective", "Objective": "opt-objective", "Assessment": "opt-assessment", "Plan": "opt-plan" };
  const optsClass = "options" + (q.options.length === 2 ? " opts-2" : "");
  const opts = el("div", { class: optsClass });
  q.options.forEach(function (opt, i) {
    let cls = "option";
    if (!feedback && SOAP_OPT_CLASS[opt]) cls += " " + SOAP_OPT_CLASS[opt];
    const btn = el("button", {
      class: cls,
      onclick: function () {
        if (feedback) { advance(); return; }
        selectAnswer(q.id, opt);
      }
    });
    btn.appendChild(el("span", { class: "key-hint", text: String(i + 1) }));
    btn.appendChild(document.createTextNode(opt));
    if (feedback) {
      if (opt === truth) btn.className += " correct";
      else if (opt === userChoice) btn.className += " wrong";
      else btn.className += " muted-opt";
    }
    if (wireHover) {
      btn.addEventListener("mouseenter", function () { highlightSidebarFor(opt); });
      btn.addEventListener("mouseleave", clearSidebarHighlight);
    }
    opts.appendChild(btn);
  });
  body.appendChild(opts);

  if (feedback) {
    const isCorrect = userChoice === truth;
    if (isCorrect) {
      body.appendChild(el("p", { class: "feedback-line correct-line", text: "Correct." }));
    } else {
      const line = el("p", { class: "feedback-line" });
      line.appendChild(document.createTextNode("Correct answer: "));
      line.appendChild(el("strong", { text: truth }));
      body.appendChild(line);
    }
    const nextRow = el("div", { class: "button-row" });
    nextRow.appendChild(el("button", { class: "primary", text: "Next \u2192", onclick: advance }));
    body.appendChild(nextRow);
    body.appendChild(el("p", { class: "muted next-hint", text: "Press Enter or Space to continue." }));
  } else {
    const skipRow = el("div", { class: "skip-row" });
    skipRow.appendChild(el("button", { class: "link", text: "Skip", onclick: function () { selectAnswer(q.id, null); } }));
    body.appendChild(skipRow);
  }

  main.appendChild(body);
}

// --- Results -----------------------------------------------------------------
function getResultsTier(percent) {
  if (percent >= 90) return { key: "outstanding", emoji: "\uD83C\uDFC6", side: "\uD83C\uDF89 \u2728 \uD83C\uDF1F", headline: "Outstanding!", caption: "You nailed the edge cases." };
  if (percent >= 75) return { key: "strong", emoji: "\uD83C\uDFAF", side: "\uD83D\uDCAA \u2728", headline: "Strong work!", caption: "Sharp instincts on a tricky set." };
  if (percent >= 60) return { key: "solid", emoji: "\uD83D\uDC4D", side: "\uD83D\uDCD8 \uD83D\uDCA1", headline: "Solid effort.", caption: "A good grasp of the framework." };
  if (percent >= 40) return { key: "growing", emoji: "\uD83D\uDCDA", side: "\uD83E\uDD14 \uD83D\uDCD6", headline: "Room to grow.", caption: "The patterns will click with more reps." };
  return { key: "practice", emoji: "\uD83C\uDF31", side: "\uD83D\uDCAD \uD83C\uDF31", headline: "Keep practicing.", caption: "Every attempt sharpens the eye." };
}

function renderCelebrationCard() {
  const score = computeScore();
  if (!score || score.answeredWithTruth === 0) {
    const card = el("div", { class: "celebration tier-growing" });
    card.appendChild(el("div", { class: "celeb-emoji", text: "\uD83D\uDCED" }));
    card.appendChild(el("div", { class: "celeb-headline", text: "No answers recorded" }));
    card.appendChild(el("div", { class: "celeb-caption", text: "All questions were skipped." }));
    return card;
  }
  const tier = getResultsTier(score.percent);
  const card = el("div", { class: "celebration tier-" + tier.key });
  card.appendChild(el("div", { class: "celeb-emoji bob", text: tier.emoji }));
  card.appendChild(el("div", { class: "celeb-side", text: tier.side }));
  card.appendChild(el("div", { class: "celeb-headline", text: tier.headline }));
  card.appendChild(el("div", { class: "celeb-score", text: score.correct + " / " + score.answeredWithTruth }));
  card.appendChild(el("div", { class: "celeb-percent", text: score.percent + "% correct" }));

  const diffBuckets = { easy: { correct: 0, total: 0 }, medium: { correct: 0, total: 0 }, hard: { correct: 0, total: 0 } };
  const gt = session.groundTruth;
  QUESTIONS.forEach(function (q) {
    if (!Object.prototype.hasOwnProperty.call(gt, q.id)) return;
    const ans = session.answers[q.id];
    if (ans === undefined || ans === null) return;
    if (!diffBuckets[q.difficulty]) return;
    diffBuckets[q.difficulty].total++;
    if (ans === gt[q.id]) diffBuckets[q.difficulty].correct++;
  });
  const pills = el("div", { class: "celeb-pills" });
  VALID_DIFFICULTIES.forEach(function (d) {
    const b = diffBuckets[d];
    pills.appendChild(el("span", { class: "celeb-pill diff-" + d + (b.total === 0 ? " dim" : ""), text: DIFFICULTY_LABELS[d] + " " + b.correct + "/" + b.total }));
  });
  card.appendChild(pills);
  card.appendChild(el("div", { class: "celeb-caption", text: tier.caption }));
  return card;
}

function renderResults() {
  app.appendChild(renderCelebrationCard());

  const score = computeScore();
  const startPct = score ? score.percent : 0;
  const playRow = el("div", { class: "button-row" });
  playRow.appendChild(el("button", {
    class: "secondary",
    text: "Play again",
    onclick: function () { startNewSession(); }
  }));
  playRow.appendChild(el("button", {
    class: "primary",
    text: "Keep playing \u2192",
    title: "Start an infinite drill at " + DIFFICULTY_LABELS[pickInfiniteStartDifficulty(startPct)].toLowerCase() + " difficulty",
    onclick: function () {
      startInfiniteSession(pickInfiniteStartDifficulty(startPct));
    }
  }));
  app.appendChild(playRow);

  app.appendChild(el("h2", { text: "Recap" }));
  const playOrder = (session.playOrder || []).slice();
  playOrder.forEach(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) return;
    const item = el("div", { class: "results-item" });
    const meta = el("div", { class: "results-meta" });
    meta.appendChild(el("span", { class: "category", text: q.category }));
    meta.appendChild(el("span", { class: "diff-tag diff-" + q.difficulty, text: DIFFICULTY_LABELS[q.difficulty] }));
    item.appendChild(meta);
    item.appendChild(el("div", { class: "situation", text: q.situation }));
    const tEl = el("div", { class: "transcript" });
    tEl.appendChild(renderTranscript(q.transcript));
    item.appendChild(tEl);

    const ul = el("ul", { class: "results-options" });
    const has = Object.prototype.hasOwnProperty.call(session.answers, q.id);
    const choice = has ? session.answers[q.id] : undefined;
    const truth = session.groundTruth ? session.groundTruth[q.id] : undefined;
    q.options.forEach(function (opt) {
      const li = el("li", { text: opt });
      let cls = "";
      if (truth && opt === truth) cls += " truth";
      if (choice === opt) {
        cls += " chosen";
        if (truth && opt !== truth) cls += " wrong";
      }
      if (cls) li.className += cls;
      ul.appendChild(li);
    });
    if (choice === null) ul.appendChild(el("li", { class: "skipped", text: "Skipped" }));
    item.appendChild(ul);
    app.appendChild(item);
  });
}

function renderInfiniteResults() {
  if (!session || session.mode !== "infinite") { startNewSession(); return; }

  const card = el("div", { class: "infinite-results" });
  card.appendChild(el("h1", { text: "Infinite run complete" }));
  const subText = (session.totalAnswered === 0)
    ? "No questions answered yet."
    : "Nice run. Take a breather, then keep going or restart.";
  card.appendChild(el("p", { class: "sub", text: subText }));

  const accuracy = (session.totalAnswered > 0)
    ? Math.round((session.correctCount / session.totalAnswered) * 1000) / 10
    : 0;
  const avgSec = (session.totalAnswered > 0)
    ? Math.round(session.totalTimeMs / session.totalAnswered / 100) / 10
    : 0;

  const stats = el("div", { class: "stat-grid" });
  function stat(label, value) {
    const s = el("div", { class: "stat" });
    s.appendChild(el("div", { class: "label", text: label }));
    s.appendChild(el("div", { class: "value", text: value }));
    return s;
  }
  stats.appendChild(stat("Answered", String(session.totalAnswered)));
  stats.appendChild(stat("Correct", session.correctCount + " / " + session.totalAnswered));
  stats.appendChild(stat("Accuracy", accuracy + "%"));
  stats.appendChild(stat("Best streak", String(session.bestStreak)));
  if (session.totalAnswered > 0) stats.appendChild(stat("Avg time", avgSec + "s"));
  card.appendChild(stats);

  // Per-difficulty breakdown.
  const buckets = { easy: { c: 0, t: 0 }, medium: { c: 0, t: 0 }, hard: { c: 0, t: 0 } };
  (session.history || []).forEach(function (h) {
    if (!buckets[h.difficulty]) return;
    buckets[h.difficulty].t++;
    if (h.correct) buckets[h.difficulty].c++;
  });
  const breakdown = el("div", { class: "breakdown" });
  VALID_DIFFICULTIES.forEach(function (d) {
    const b = buckets[d];
    breakdown.appendChild(el("span", {
      class: "celeb-pill diff-" + d + (b.t === 0 ? " dim" : ""),
      text: DIFFICULTY_LABELS[d] + " " + b.c + "/" + b.t
    }));
  });
  card.appendChild(breakdown);
  app.appendChild(card);

  const row = el("div", { class: "button-row" });
  row.appendChild(el("button", {
    class: "secondary",
    text: "Play again from start",
    onclick: function () { startNewSession(); }
  }));
  if (session.currentQid != null || session.totalAnswered > 0) {
    row.appendChild(el("button", {
      class: "primary",
      text: "Continue infinite",
      onclick: continueInfiniteSession
    }));
  }
  app.appendChild(row);
}

// --- Render dispatch ---------------------------------------------------------
function render() {
  app.innerHTML = "";
  document.body.classList.toggle("has-sidebar", screen === "quiz" && !!session);
  if (screen === "quiz") renderQuiz();
  else if (screen === "results") renderResults();
  else if (screen === "infinite-results") renderInfiniteResults();
  window.scrollTo(0, 0);
}

// --- Keyboard shortcuts ------------------------------------------------------
document.addEventListener("keydown", function (e) {
  if (e.target) {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.target.isContentEditable) return;
  }
  if (screen === "quiz" && session) {
    const inFeedback = isFeedbackActive();
    if (inFeedback) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        advance();
      }
      return;
    }
    // Infinite-mode difficulty shortcuts: [ moves down, ] moves up.
    if (session.mode === "infinite") {
      if (e.key === "[") { e.preventDefault(); setInfiniteDifficulty(stepDifficulty(session.difficulty, -1)); return; }
      if (e.key === "]") { e.preventDefault(); setInfiniteDifficulty(stepDifficulty(session.difficulty, +1)); return; }
    }
    const num = parseInt(e.key, 10);
    if (Number.isInteger(num) && num >= 1 && num <= 9) {
      const q = getCurrentQuestion();
      if (!q || num > q.options.length) return;
      e.preventDefault();
      selectAnswer(q.id, q.options[num - 1]);
    }
  } else if (screen === "results") {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      const score = computeScore();
      startInfiniteSession(pickInfiniteStartDifficulty(score ? score.percent : 0));
    }
  } else if (screen === "infinite-results") {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      continueInfiniteSession();
    }
  }
});

// --- Boot --------------------------------------------------------------------
startNewSession();

</script>
</body>
</html>
