<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOAP Classification Quiz</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --btn-bg: #ffffff;
    --btn-hover: #f3f4f6;
    --btn-active: #e5e7eb;
    --highlight: #dbeafe;
    --highlight-border: #2563eb;
    --correct-bg: #d1fae5;
    --correct-border: #10b981;
    --correct-fg: #065f46;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-fg: #991b1b;
    --pill-bg: #eef2ff;
    --pill-fg: #3730a3;
    --error-fg: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }
  h1 {
    font-size: 28px;
    margin: 24px 0 12px;
    line-height: 1.3;
  }
  h2 {
    font-size: 20px;
    margin: 32px 0 12px;
    line-height: 1.3;
  }
  h3 {
    font-size: 16px;
    margin: 24px 0 8px;
    line-height: 1.3;
  }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  .category {
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .situation {
    color: #4b5563;
    font-size: 16px;
    font-weight: normal;
    margin-bottom: 10px;
  }
  .transcript {
    font-size: 17px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .transcript .speaker {
    color: var(--muted);
    font-weight: normal;
    margin-right: 4px;
  }
  .transcript mark {
    background: transparent;
    color: #0b6b3a;
    font-weight: 700;
    padding: 0;
    border-radius: 0;
    text-decoration: none;
  }
  .instruction {
    font-size: 15px;
    font-weight: normal;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .question {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  button.option, button.primary, button.secondary {
    font: inherit;
    width: 100%;
    padding: 16px 20px;
    text-align: left;
    background: var(--btn-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  button.option:hover:not(:disabled):not(.correct):not(.wrong):not(.muted-opt) { background: var(--btn-hover); border-color: #cbd5e1; }
  button.option:active:not(:disabled):not(.correct):not(.wrong):not(.muted-opt) { background: var(--btn-active); }
  button.option:disabled { cursor: default; }
  button.option.opt-subjective { border-left: 4px solid #2563eb; background: rgba(37, 99, 235, 0.07); }
  button.option.opt-subjective:hover:not(.correct):not(.wrong):not(.muted-opt) { background: rgba(37, 99, 235, 0.13); border-color: #2563eb; }
  button.option.opt-objective { border-left: 4px solid #059669; background: rgba(5, 150, 105, 0.07); }
  button.option.opt-objective:hover:not(.correct):not(.wrong):not(.muted-opt) { background: rgba(5, 150, 105, 0.13); border-color: #059669; }
  button.option.opt-assessment { border-left: 4px solid #7c3aed; background: rgba(124, 58, 237, 0.07); }
  button.option.opt-assessment:hover:not(.correct):not(.wrong):not(.muted-opt) { background: rgba(124, 58, 237, 0.13); border-color: #7c3aed; }
  button.option.opt-plan { border-left: 4px solid #d97706; background: rgba(217, 119, 6, 0.08); }
  button.option.opt-plan:hover:not(.correct):not(.wrong):not(.muted-opt) { background: rgba(217, 119, 6, 0.15); border-color: #d97706; }
  button.option.correct,
  button.option.correct:hover,
  button.option.correct:focus,
  button.option.correct:active {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-fg);
    font-weight: 600;
  }
  button.option.wrong,
  button.option.wrong:hover,
  button.option.wrong:focus,
  button.option.wrong:active {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-fg);
    font-weight: 600;
  }
  button.option.muted-opt,
  button.option.muted-opt:hover,
  button.option.muted-opt:focus,
  button.option.muted-opt:active {
    opacity: 0.6;
    background: var(--btn-bg);
    border-color: var(--border);
    color: var(--fg);
  }
  button.option.correct:hover { box-shadow: 0 0 0 2px #047857; }
  button.option.wrong:hover { box-shadow: 0 0 0 2px #b91c1c; }
  button.option.muted-opt:hover { box-shadow: 0 0 0 2px #9ca3af; opacity: 0.78; }
  button.option.correct:hover::after,
  button.option.wrong:hover::after,
  button.option.muted-opt:hover::after {
    content: "\2192 Next";
    float: right;
    font-size: 12px;
    font-weight: 600;
    opacity: 0.75;
    margin-left: 12px;
  }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    text-align: center;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    text-align: center;
  }
  button.secondary:hover { background: var(--btn-hover); }
  .button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .button-row button { flex: 1; min-width: 200px; }
  a.link, button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    text-decoration: underline;
  }
  a.link:hover, button.link:hover { color: var(--fg); }
  .skip-row {
    text-align: center;
    margin-top: 8px;
  }
  .results-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    background: white;
  }
  .results-item .category { margin-bottom: 4px; }
  .results-options {
    list-style: none;
    padding: 0;
    margin: 8px 0 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .results-options li {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .results-options li.chosen {
    background: var(--highlight);
    border-color: var(--highlight-border);
    font-weight: 600;
  }
  .results-options li.truth {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-fg);
  }
  .results-options li.chosen.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-fg);
  }
  .results-options li.skipped {
    color: var(--muted);
    font-style: italic;
  }
  .summary {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .header-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 0;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
    font-size: 14px;
  }
  .header-bar .player {
    font-weight: 600;
  }
  .header-bar .progress-text {
    color: var(--muted);
  }
  .header-bar .spacer { margin-left: auto; }
  .pill {
    display: inline-block;
    padding: 4px 10px;
    background: var(--pill-bg);
    color: var(--pill-fg);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
  }
  .header-bar button.finish {
    font: inherit;
    padding: 6px 12px;
    background: var(--btn-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .header-bar button.finish:hover { background: var(--btn-hover); }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--fg);
  }
  .field input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .field-inline {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field-inline input[type="checkbox"] {
    width: 16px;
    height: 16px;
  }
  .step {
    margin-bottom: 22px;
  }
  .step h3 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .mode-option {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color 0.1s ease, background 0.1s ease;
  }
  .mode-option:hover { border-color: #cbd5e1; }
  .mode-option.selected {
    border-color: var(--accent);
    background: var(--highlight);
  }
  .mode-option input[type="radio"] {
    margin: 4px 0 0 0;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .mode-option .mode-label {
    flex: 1;
  }
  .mode-option .mode-name {
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }
  .mode-option .mode-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .resume-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .resume-panel h2 {
    margin-top: 0;
  }
  /* Two-author identity accents */
  body.identity-active-flore_mathieu { border-top: 3px solid #93c5fd; }
  body.identity-active-frances { border-top: 3px solid #fcd34d; }
  .identity-resume-flore_mathieu { border-left: 4px solid #93c5fd; }
  .identity-resume-frances { border-left: 4px solid #fcd34d; }
  .identity-option-flore_mathieu.selected { border-color: #93c5fd; background: #eff6ff; }
  .identity-option-frances.selected { border-color: #fcd34d; background: #fffbeb; }
  .header-bar .player.identity-flore_mathieu { color: #1e40af; }
  .header-bar .player.identity-frances { color: #92400e; }
  /* Mathieu-hint pill above Frances's option buttons */
  .mathieu-hint {
    margin: 4px 0 10px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .mathieu-hint-line {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mathieu-hint strong {
    font-weight: 600;
    font-style: normal;
    color: var(--fg);
  }
  .mathieu-note-toggle {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .mathieu-note-toggle:hover { background: #f3f4f6; }
  .mathieu-note {
    margin-top: 6px;
    padding: 8px 10px;
    border-left: 3px solid #fcd34d;
    background: #fffbeb;
    color: var(--fg);
    font-style: normal;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .option.from-mathieu {
    position: relative;
    border-left: 3px solid #c4b5fd;
  }
  .option.from-mathieu::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c4b5fd;
  }
  .muted.small { font-size: 12px; }
  .new-session-divider {
    margin: 32px 0 16px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .incorrect-row {
    border: 1px solid var(--wrong-border);
    background: var(--wrong-bg);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    color: var(--wrong-fg);
    font-size: 14px;
  }
  .incorrect-row .question {
    color: var(--fg);
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .breakdown-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .breakdown-table td, .breakdown-table th {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .breakdown-table th { color: var(--muted); font-weight: 500; }
  .results-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .results-meta .category { margin-bottom: 0; }
  .diff-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .diff-easy { background: #d1fae5; color: #065f46; }
  .diff-medium { background: #fef3c7; color: #92400e; }
  .diff-hard { background: #fee2e2; color: #991b1b; }
  .test-breakdown {
    margin: 12px 0;
    padding: 12px 14px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .test-breakdown .band { display: inline-block; margin-right: 14px; }
  .test-breakdown .short { color: var(--wrong-fg); font-weight: 600; }
  body.test-mode main,
  body.has-sidebar main { max-width: 1000px; }
  body.test-mode .header-bar .progress-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: 0.01em;
  }
  body.test-mode .header-bar .diff-tag {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  body.test-mode .header-bar .diff-easy { background: #10b981; color: white; }
  body.test-mode .header-bar .diff-medium { background: #f59e0b; color: white; }
  body.test-mode .header-bar .diff-hard { background: #ef4444; color: white; }
  .test-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .test-main { flex: 1; min-width: 0; }
  .test-sidebar {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-size: 14px;
  }
  .test-sidebar-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .soap-node {
    border-left: 3px solid var(--border);
    padding: 4px 0 4px 10px;
    margin-bottom: 10px;
    border-radius: 0 4px 4px 0;
    transition: background 0.1s ease;
  }
  .soap-name {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .soap-blue { border-left-color: #2563eb; }
  .soap-blue .soap-name { color: #1d4ed8; }
  .soap-green { border-left-color: #059669; }
  .soap-green .soap-name { color: #047857; }
  .soap-purple { border-left-color: #7c3aed; }
  .soap-purple .soap-name { color: #6d28d9; }
  .soap-orange { border-left-color: #d97706; }
  .soap-orange .soap-name { color: #b45309; }
  .sub-list {
    list-style: none;
    padding: 0;
    margin: 6px 0 0 0;
  }
  .sub-node {
    padding: 3px 8px;
    color: var(--muted);
    border-radius: 4px;
    font-size: 13px;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .sub-node.hover {
    background: #fef3c7;
    color: var(--fg);
    font-weight: 600;
  }
  .soap-node.hover-parent { background: #fffbeb; }
  @media (max-width: 900px) {
    body.test-mode main,
    body.has-sidebar main { max-width: 640px; }
    .test-layout { flex-direction: column; }
    .test-sidebar {
      width: 100%;
      position: static;
    }
  }
  .celebration {
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    margin: 0 0 24px;
    border: 1px solid transparent;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .celeb-emoji {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 6px;
  }
  .celeb-side {
    font-size: 1.4rem;
    letter-spacing: 0.35em;
    margin-bottom: 6px;
  }
  .celeb-headline {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 18px;
    color: #1f2937;
  }
  .celeb-score {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1.05;
    color: #111827;
  }
  .celeb-percent {
    color: #4b5563;
    font-size: 15px;
    margin: 4px 0 18px;
  }
  .celeb-pills {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .celeb-pill {
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    color: white;
    letter-spacing: 0.02em;
  }
  .celeb-pill.diff-easy { background: #10b981; }
  .celeb-pill.diff-medium { background: #f59e0b; }
  .celeb-pill.diff-hard { background: #ef4444; }
  .celeb-pill.dim { opacity: 0.55; }
  .celeb-caption {
    font-style: italic;
    color: #1f2937;
    font-size: 15px;
  }
  .celebration.tier-outstanding {
    background: linear-gradient(135deg, #fef3c7 0%, #fdba74 100%);
    border-color: #f59e0b;
  }
  .celebration.tier-strong {
    background: linear-gradient(135deg, #d1fae5 0%, #6ee7b7 100%);
    border-color: #10b981;
  }
  .celebration.tier-solid {
    background: linear-gradient(135deg, #dbeafe 0%, #93c5fd 100%);
    border-color: #3b82f6;
  }
  .celebration.tier-growing {
    background: linear-gradient(135deg, #e5e7eb 0%, #cbd5e1 100%);
    border-color: #94a3b8;
  }
  .celebration.tier-practice {
    background: linear-gradient(135deg, #f5f5f4 0%, #e7e5e4 100%);
    border-color: #a8a29e;
  }
  .celebration.tier-neutral {
    background: linear-gradient(135deg, #f9fafb 0%, #e5e7eb 100%);
    border-color: #d1d5db;
  }
  @keyframes celeb-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .celeb-emoji.bob { animation: celeb-bob 2.4s ease-in-out infinite; }

  /* Keyboard number hint badges on option buttons */
  button.option { position: relative; padding-left: 48px; min-height: 56px; }
  .key-hint {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #f3f4f6;
    color: #6b7280;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    border: 1px solid var(--border);
  }

  /* "Your previous answer" outline on Back-revisit */
  button.option.previous-choice {
    box-shadow: inset 0 0 0 2px #94a3b8;
  }
  .prev-tag {
    float: right;
    font-size: 11px;
    color: #6b7280;
    font-style: italic;
    margin-left: 12px;
    pointer-events: none;
  }

  /* Inline feedback line ("Correct." / "Correct answer: X") */
  .feedback-line {
    margin: 14px 0 6px;
    color: var(--muted);
    font-size: 14px;
  }
  .feedback-line.correct-line { color: #047857; font-weight: 600; }
  .feedback-line strong { color: var(--fg); font-weight: 700; }

  /* Skipped pill (neutral) */

  .options.mode1-post button.option.opt-subjective:hover { box-shadow: 0 0 0 2px #2563eb; }

  .options.mode1-post button.option.opt-assessment:hover { box-shadow: 0 0 0 2px #7c3aed; }

  .category-banner {

  // Test mode (the only non-mode-1 mode) is short and doesn't autosave or resume.
  // Clean up any stale v3 payload so it doesn't linger.
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  return null;
}

function loadMode1SessionFor(identity) {
  if (IDENTITIES.indexOf(identity) === -1) return null;
  try {
    const raw = localStorage.getItem(mode1StorageKey(identity));
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== "object") return null;
    if (!Array.isArray(s.order)) return null;
    if (!s.answers || typeof s.answers !== "object") return null;
    s.identity = identity;
    s.player = IDENTITY_LABELS[identity];
    s.mode = "practice_no_truth";
    s.randomized = false;
    s.questionSet = VALID_QUESTION_SETS.indexOf(s.questionSet) !== -1 ? s.questionSet : "both";
    s.playOrder = Array.isArray(s.playOrder) ? s.playOrder.filter(function (x) { return Number.isInteger(x); }) : [];
    if (Array.isArray(s.difficulties)) {
      s.difficulties = s.difficulties.filter(function (d) { return VALID_DIFFICULTIES.indexOf(d) !== -1; });
      if (s.difficulties.length === 0) s.difficulties = VALID_DIFFICULTIES.slice();
    } else {
      s.difficulties = VALID_DIFFICULTIES.slice();
    }
    if (!s.times || typeof s.times !== "object") s.times = {};
    if (!s.uncertain || typeof s.uncertain !== "object") s.uncertain = {};
    if (!s.notes || typeof s.notes !== "object") s.notes = {};
    if (!s.destroyed || typeof s.destroyed !== "object") s.destroyed = {};
    if (!Array.isArray(s.recentDurations)) s.recentDurations = [];
    if (typeof s.lastExportAt !== "string") s.lastExportAt = null;
    if (typeof s.exportRemindAt !== "number") s.exportRemindAt = null;
    if (typeof s.hideRecentStrip !== "boolean") s.hideRecentStrip = false;
    s.groundTruth = null;
    return s;
  } catch (e) { return null; }
}

function refreshMode1SavedSessions() {
  mode1SavedSessions = {
    flore_mathieu: loadMode1SessionFor("flore_mathieu"),
    frances: loadMode1SessionFor("frances")
  };
}

function loadMathieuDraft() {

}

function saveSession() {

    saveMode1Session();
  } else {
    saveGenericSession();

}

function saveGenericSession() {

}

function saveMode1Session() {
  const identity = session.identity || "flore_mathieu";
  const toSave = {
    identity: identity,
    player: IDENTITY_LABELS[identity] || session.player,
    mode: "practice_no_truth",

    difficulties: session.difficulties,
    order: session.order,
    playOrder: session.playOrder || [],
    answers: session.answers,

    startedAt: session.startedAt,
    uncertain: session.uncertain || {},
    notes: session.notes || {},
    destroyed: session.destroyed || {},

  };
  localStorage.setItem(mode1StorageKey(identity), JSON.stringify(toSave));

function clearGenericSession() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  genericSavedSession = null;
}

function clearMode1SessionFor(identity) {
  try { localStorage.removeItem(mode1StorageKey(identity)); } catch (e) {}
  if (mode1SavedSessions) mode1SavedSessions[identity] = null;
}

function isDestroyed(id) {
  // Source-level discards apply in every mode and at every screen.
  if (isSourceDiscarded(id)) return true;
  if (!session || session.mode !== "practice_no_truth") return false;
  if (session.destroyed && session.destroyed[id]) return true;
  if (session.identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed && mathieuDraftCache.destroyed[id]) return true;
  return false;
}

function markDestroyed(id) {
  if (!session || session.mode !== "practice_no_truth") return;
  if (!session.destroyed) session.destroyed = {};
  session.destroyed[id] = { at: new Date().toISOString() };
  saveSession();
}

function destroyedListForState(state) {
  if (!state || !state.destroyed) return [];
  const ids = Object.keys(state.destroyed).map(function (k) { return +k; }).filter(function (id) { return Number.isInteger(id); });
  ids.sort(function (a, b) {
    const aAt = state.destroyed[a] && state.destroyed[a].at;
    const bAt = state.destroyed[b] && state.destroyed[b].at;
    if (aAt && bAt) return aAt < bAt ? 1 : -1;
    return a - b;
  });
  return ids.map(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    return { id: id, q: q || null, at: (state.destroyed[id] && state.destroyed[id].at) || null };
  }).filter(function (e) { return e.q; });
}

function destroyedListWithMeta() {
  if (session && session.mode === "practice_no_truth") return destroyedListForState(session);
  return [];
}

function restoreQuestionInState(state, id) {
  if (!state || !state.destroyed || !state.destroyed[id]) return false;
  delete state.destroyed[id];
  insertIntoMode1OrderForState(state, id);
  if (state === session) saveSession();
  else if (state.identity) {
    localStorage.setItem(mode1StorageKey(state.identity), JSON.stringify({
      identity: state.identity,
      player: state.player,
      mode: "practice_no_truth",
      questionSet: state.questionSet,
      difficulties: state.difficulties,
      order: state.order,
      playOrder: state.playOrder || [],
      answers: state.answers,
      times: state.times || {},
      startedAt: state.startedAt,
      uncertain: state.uncertain || {},
      notes: state.notes || {},
      destroyed: state.destroyed,
      recentDurations: state.recentDurations || [],
      lastExportAt: state.lastExportAt || null,
      exportRemindAt: typeof state.exportRemindAt === "number" ? state.exportRemindAt : null,
      hideRecentStrip: !!state.hideRecentStrip
    }));
  }
  return true;
}

function restoreQuestion(id) {
  if (!session || session.mode !== "practice_no_truth") return;
  restoreQuestionInState(session, id);
  flashSaved();
}

function clearDestroyedInState(state) {
  if (!state) return;
  state.destroyed = {};
  if (state === session) saveSession();
  else if (state.identity) {
    const stored = loadMode1SessionFor(state.identity);
    if (stored) {
      stored.destroyed = {};
      localStorage.setItem(mode1StorageKey(state.identity), JSON.stringify(stored));
    }
  }
}

function countMode1Stats(s) {
  if (!s) return { answered: 0, destroyed: 0, total: 0, remaining: 0 };
  // Source-discarded ids never count toward totals, even for cached sessions
  // built before the annotation was added.
  const ids = (Array.isArray(s.order) ? s.order : []).filter(function (id) { return !isSourceDiscarded(id); });
  const destroyedMap = s.destroyed || {};
  // Frances also treats Mathieu's discards as destroyed even if her own state was loaded before Mathieu re-saved.
  const extra = (s.identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed) ? mathieuDraftCache.destroyed : null;
  let answered = 0, destroyed = 0;
  ids.forEach(function (id) {
    if (destroyedMap[id] || (extra && extra[id])) { destroyed++; return; }
    const ans = s.answers ? s.answers[id] : undefined;
    if (ans !== null && ans !== undefined) answered++;
  });
  return { answered: answered, destroyed: destroyed, total: ids.length, remaining: Math.max(0, ids.length - answered - destroyed) };
}

function totalActiveSeconds() {
  if (!session) return 0;
  const t = computeCurrentTimes();
  let sum = 0;
  for (const k in t) {
    if (Object.prototype.hasOwnProperty.call(t, k) && typeof t[k] === "number") sum += t[k];
  }
  return sum;
}

function pushRecentDuration(sec) {
  if (!session || session.mode !== "practice_no_truth") return;
  if (typeof sec !== "number" || !isFinite(sec) || sec < 0) return;
  if (!Array.isArray(session.recentDurations)) session.recentDurations = [];
  session.recentDurations.push(sec);
  if (session.recentDurations.length > 20) {
    session.recentDurations = session.recentDurations.slice(-20);
  }
}

function computeETA() {
  if (!session || session.mode !== "practice_no_truth") return null;
  const arr = session.recentDurations || [];
  if (arr.length < 5) return null;
  let sum = 0;
  arr.forEach(function (v) { sum += v; });
  const avg = sum / arr.length;
  let remaining = 0;
  session.order.forEach(function (id) {
    if (isDestroyed(id)) return;
    const a = session.answers[id];
    if (a === null || a === undefined) remaining++;
  });
  const seconds = avg * remaining;
  return { avg: avg, remaining: remaining, seconds: seconds };
}

function formatEtaLabel(eta) {
  if (!eta || eta.seconds <= 0 || eta.remaining === 0) return "Almost done";
  const mins = Math.round(eta.seconds / 60);
  if (mins <= 1) return "~1 min left at current pace";
  if (mins < 60) return "~" + mins + " min left at current pace";
  const hours = Math.floor(mins / 60);
  const remM = mins - hours * 60;
  return "~" + hours + "h " + remM + "m left at current pace";
}

function flashSaved() {
  const el = document.getElementById("saved-indicator");
  if (!el) return;
  el.classList.add("visible");
  if (savedIndicatorTimeout) clearTimeout(savedIndicatorTimeout);
  savedIndicatorTimeout = setTimeout(function () {
    el.classList.remove("visible");
  }, 1100);
}

function isMode1Post() {
  if (!session || session.mode !== "practice_no_truth") return false;
  const q = getQuestion(currentIndex);
  if (!q) return false;
  const a = session.answers[q.id];
  return a !== null && a !== undefined;
}

function findNextMatching(predicate, fromIdx) {
  if (!session) return -1;
  const start = typeof fromIdx === "number" ? fromIdx : currentIndex + 1;
  const n = session.order.length;
  for (let off = 0; off < n; off++) {
    const i = ((start + off) % n + n) % n;
    const id = session.order[i];
    if (isDestroyed(id)) continue;
    if (predicate(id)) return i;
  }
  return -1;
}

function jumpToId(id) {
  if (!session) return false;
  const idx = session.order.indexOf(id);
  if (idx === -1) return false;
  if (isDestroyed(id)) return false;
  finalizeTimer();
  currentIndex = idx;
  pendingDiscardConfirm = false;
  jumpPanelOpen = false;
  suppressNextFade = false;
  render();
  return true;
}

function jumpToIndex(idx) {
  if (!session || idx < 0 || idx >= session.order.length) return false;
  finalizeTimer();
  currentIndex = idx;
  pendingDiscardConfirm = false;
  jumpPanelOpen = false;
  suppressNextFade = false;
  render();
  return true;
}

function insertIntoMode1OrderForState(state, id) {
  if (!state || state.mode !== "practice_no_truth") return;
  if (state.order.indexOf(id) !== -1) return;
  const q = QUESTIONS.find(function (x) { return x.id === id; });
  if (!q) return;
  if (state.questionSet !== "both" && q.set !== state.questionSet) return;
  if ((state.difficulties || VALID_DIFFICULTIES).indexOf(q.difficulty) === -1) return;
  if (state.identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed && mathieuDraftCache.destroyed[id]) return;
  const diffRank = { easy: 0, medium: 1, hard: 2 };
  const cmpKey = function (qq) {
    return [diffRank[qq.difficulty] || 0, qq.category, qq.id];
  };
  const ckQ = cmpKey(q);
  let insertAt = state.order.length;
  for (let i = 0; i < state.order.length; i++) {
    const oq = QUESTIONS.find(function (x) { return x.id === state.order[i]; });
    if (!oq) continue;
    const ck = cmpKey(oq);
    if (ckQ[0] < ck[0] || (ckQ[0] === ck[0] && (ckQ[1] < ck[1] || (ckQ[1] === ck[1] && ckQ[2] < ck[2])))) {
      insertAt = i;
      break;
    }
  }
  state.order.splice(insertAt, 0, id);
  if (state === session && insertAt <= currentIndex) currentIndex++;
}

function insertIntoMode1Order(id) {
  insertIntoMode1OrderForState(session, id);
}

function recentAnsweredIds(excludingId) {
  if (!session || !session.playOrder) return [];
  const out = [];
  for (let i = session.playOrder.length - 1; i >= 0 && out.length < 3; i--) {
    const id = session.playOrder[i];
    if (id === excludingId) continue;
    if (isDestroyed(id)) continue;
    const a = session.answers[id];
    if (a === null || a === undefined) continue;
    out.push(id);
  }
  return out;
}

function setUncertain(id, val) {
  if (!session || session.mode !== "practice_no_truth") return;
  if (!session.uncertain) session.uncertain = {};
  if (val) {
    session.uncertain[id] = true;
    playSessionUncertainIds.add(id);
  } else {
    delete session.uncertain[id];
  }
  saveSession();
  flashSaved();
}

function saveNote(id, text) {
  if (!session || session.mode !== "practice_no_truth") return;
  if (!session.notes) session.notes = {};
  if (text === "" || text === null || text === undefined) delete session.notes[id];
  else session.notes[id] = String(text);
  saveSession();
  flashSaved();
}

function scheduleNoteSave(id, text) {
  if (_noteSaveTimers[id]) clearTimeout(_noteSaveTimers[id]);
  _noteSaveTimers[id] = setTimeout(function () {
    saveNote(id, text);
    delete _noteSaveTimers[id];
  }, 500);
}

function initPlaySession() {
  playSessionStartedAt = new Date().toISOString();
  playSessionAnsweredIds = new Set();
  playSessionDiscardedIds = new Set();
  playSessionUncertainIds = new Set();
  playSessionActiveSecondsBase = totalActiveSeconds();
}

function ensureExportRemindAt() {
  if (!session || session.mode !== "practice_no_truth") return;
  if (typeof session.exportRemindAt !== "number" || session.exportRemindAt <= 0) {
    session.exportRemindAt = totalActiveSeconds() + 30 * 60;
  }
}

function shouldShowExportReminder() {
  if (!session || session.mode !== "practice_no_truth") return false;
  ensureExportRemindAt();
  return totalActiveSeconds() >= session.exportRemindAt;
}

function snoozeExportReminder() {
  if (!session) return;
  session.exportRemindAt = totalActiveSeconds() + 30 * 60;
  saveSession();
}

function buildSessionReport(endedAt) {
  const ended = endedAt || new Date().toISOString();
  const startedAt = playSessionStartedAt || (session && session.startedAt) || ended;
  const activeSec = Math.max(0, totalActiveSeconds() - playSessionActiveSecondsBase);
  const answered = Array.from(playSessionAnsweredIds);
  const avg = answered.length > 0 ? activeSec / answered.length : 0;
  const diffCounts = { easy: 0, medium: 0, hard: 0 };
  const catCounts = {};
  let uncertainCount = 0;
  let discardedWithNotes = 0;
  answered.forEach(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    if (!q) return;
    if (diffCounts[q.difficulty] !== undefined) diffCounts[q.difficulty]++;
    catCounts[q.category] = (catCounts[q.category] || 0) + 1;
    if (session && session.uncertain && session.uncertain[id]) uncertainCount++;
  });
  playSessionDiscardedIds.forEach(function (id) {
    if (session && session.notes && typeof session.notes[id] === "string" && session.notes[id].trim() !== "") {
      discardedWithNotes++;
    }
  });
  return {
    player: session ? session.player : null,
    mode: "practice_no_truth",
    play_started_at: startedAt,
    play_ended_at: ended,
    questions_answered: answered.length,
    questions_discarded: playSessionDiscardedIds.size,
    active_time_seconds: Math.round(activeSec * 10) / 10,
    avg_seconds_per_question: Math.round(avg * 10) / 10,
    by_difficulty: diffCounts,
    by_category: catCounts,
    uncertain_flagged: uncertainCount,
    discarded_with_notes: discardedWithNotes
  };
}

function downloadSessionReport() {
  const payload = buildSessionReport(new Date().toISOString());
  if (session && session.identity) payload.identity = session.identity;
  const who = (session && session.identity === "frances") ? "frances" : "mathieu";
  const filename = "session-report-" + who + "-" + todayDateStr() + ".json";
  triggerDownload(JSON.stringify(payload, null, 2), filename, "application/json");
}

function trackUserActivity() {
  const now = Date.now();
  const gap = now - lastActivityAt;
  lastActivityAt = now;
  if (gap > 5 * 60 * 1000 && session && session.mode === "practice_no_truth" && screen === "quiz") {
    if (now - welcomeBackShownAt > 30 * 1000) {
      showWelcomeBack();
      welcomeBackShownAt = now;
    }
  }
}

function showWelcomeBack() {
  const existing = document.querySelector(".welcome-back");
  if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  const q = getQuestion(currentIndex);
  if (!q) return;
  const banner = document.createElement("div");
  banner.className = "welcome-back";
  const heading = document.createElement("strong");
  heading.textContent = "Welcome back.";
  const detail = document.createElement("span");
  detail.textContent = " You were on #" + q.id + " \u2014 " + (DIFFICULTY_LABELS[q.difficulty] || q.difficulty) + ", " + q.category + ".";
  banner.appendChild(heading);
  banner.appendChild(detail);
  const btn = document.createElement("button");
  btn.className = "welcome-back-btn";
  btn.textContent = "Continue";
  btn.addEventListener("click", function () { if (banner.parentNode) banner.parentNode.removeChild(banner); });
  banner.appendChild(btn);
  document.body.appendChild(banner);
  setTimeout(function () {
    if (banner.parentNode) banner.parentNode.removeChild(banner);
  }, 4000);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

const TEST_SEQUENCE_SHAPE = { easy: 2, medium: 2, hard: 1 };
const TEST_SEQUENCE_ORDER = ["easy", "medium", "hard"];

function poolForBand(questionSet, gt, difficulty) {
  return QUESTIONS.filter(function (q) {
    if (questionSet !== "both" && q.set !== questionSet) return false;
    if (q.difficulty !== difficulty) return false;
    if (!gt || !Object.prototype.hasOwnProperty.call(gt, q.id)) return false;
    if (isDestroyed(q.id)) return false;
    return true;
  });
}

function buildMode1Order(questionSet, difficulties, extraExclude) {
  const diffRank = { easy: 0, medium: 1, hard: 2 };
  const filtered = QUESTIONS.filter(function (q) {
    if (isSourceDiscarded(q.id)) return false;
    if (questionSet !== "both" && q.set !== questionSet) return false;
    if (difficulties.indexOf(q.difficulty) === -1) return false;
    if (extraExclude && extraExclude[q.id]) return false;
    return true;
  });
  filtered.sort(function (a, b) {
    if (diffRank[a.difficulty] !== diffRank[b.difficulty]) return diffRank[a.difficulty] - diffRank[b.difficulty];
    if (a.category !== b.category) return a.category < b.category ? -1 : 1;
    return a.id - b.id;
  });
  return filtered.map(function (q) { return q.id; });
}

function countTestBandAvailability(questionSet, gt) {
  const out = {};
  VALID_DIFFICULTIES.forEach(function (d) {
    const target = TEST_SEQUENCE_SHAPE[d];
    const available = gt ? poolForBand(questionSet, gt, d).length : 0;
    out[d] = { target: target, available: available, used: Math.min(target, available) };
  });
  return out;
}

function buildTestSequence(questionSet, gt) {
  const seq = [];
  TEST_SEQUENCE_ORDER.forEach(function (d) {
    const pool = poolForBand(questionSet, gt, d);
    const ids = shuffle(pool.map(function (q) { return q.id; }));
    Array.prototype.push.apply(seq, ids.slice(0, TEST_SEQUENCE_SHAPE[d]));
  });
  return seq;
}

function startSession(opts) {
  const mode = opts.mode;
  const identity = (IDENTITIES.indexOf(opts.identity) !== -1) ? opts.identity : "flore_mathieu";
  const name = (mode === "practice_no_truth") ? IDENTITY_LABELS[identity] : (opts.player || IDENTITY_LABELS[identity]);
  const questionSet = VALID_QUESTION_SETS.indexOf(opts.questionSet) !== -1 ? opts.questionSet : "both";
  const inputDiffs = Array.isArray(opts.difficulties) ? opts.difficulties.filter(function (d) { return VALID_DIFFICULTIES.indexOf(d) !== -1; }) : [];
  const difficulties = inputDiffs.length > 0 ? inputDiffs : VALID_DIFFICULTIES.slice();
  // Effective truth = source-baked truths overridden by the user-loaded JSON.
  // Mode 1 doesn't use truth; only test mode consults it.
  const groundTruth = (mode === "test" && opts.groundTruth)
    ? mergeWithSourceTruth(opts.groundTruth)
    : null;
  // Frances reads Mathieu's latest draft as soft hints + hides his discards.
  if (mode === "practice_no_truth" && identity === "frances") {
    mathieuDraftCache = loadMathieuDraft();
  } else {
    mathieuDraftCache = null;
  }
  let order;
  let randomized;
  if (mode === "practice_no_truth") {
    const extraExclude = (identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed) ? mathieuDraftCache.destroyed : null;
    order = buildMode1Order(questionSet, difficulties, extraExclude);
    // Frances may opt to shuffle the order; Mathieu's order is forced.
    if (identity === "frances" && opts.randomize) {
      order = shuffle(order.slice());
      randomized = true;
    } else {
      randomized = false;
    }
  } else if (mode === "test" && groundTruth) {
    order = buildTestSequence(questionSet, groundTruth);
    randomized = false;
  } else {
    let ids = QUESTIONS.filter(function (q) {
      if (questionSet !== "both" && q.set !== questionSet) return false;
      if (difficulties.indexOf(q.difficulty) === -1) return false;
      return true;
    }).map(function (q) { return q.id; });
    randomized = !!opts.randomize;
    order = randomized ? shuffle(ids) : ids;
  }
  session = {
    identity: (mode === "practice_no_truth") ? identity : null,
    player: name,
    mode: mode,
    questionSet: questionSet,
    difficulties: difficulties,
    randomized: randomized,
    order: order,
    playOrder: [],
    answers: {},
    times: {},
    startedAt: new Date().toISOString(),
    groundTruth: groundTruth
  };
  if (mode === "practice_no_truth") {
    session.uncertain = {};
    session.notes = {};
    session.destroyed = {};
    session.recentDurations = [];
    session.lastExportAt = null;
    session.exportRemindAt = 30 * 60;
    session.hideRecentStrip = false;
    mode1SavedSessions[identity] = session;
  } else {
    genericSavedSession = session;
  }
  saveSession();
  currentIndex = 0;
  dismissedFeedbackFor = new Set();
  reviewMode = null;
  suppressNextFade = true;
  pendingDiscardConfirm = false;
  mode1BarValues = {};
  expandedResultsId = null;
  expandedRecentId = null;
  noteExpandedFor = new Set();
  jumpPanelOpen = false;
  discardedModalOpenFor = null;
  expandedMathieuNoteFor = null;
  _activeQid = null;
  _activeStartedAt = null;
  _lastFinalizedDeltaSec = null;
  lastActivityAt = Date.now();
  welcomeBackShownAt = Date.now();
  initPlaySession();
  screen = "quiz";
  render();
}

function getQuestion(idx) {
  if (!session || idx < 0 || idx >= session.order.length) return null;
  const id = session.order[idx];
  return QUESTIONS.find(function (q) { return q.id === id; });
}

function firstUnansweredIndex() {
  if (!session) return 0;
  for (let i = 0; i < session.order.length; i++) {
    const id = session.order[i];
    if (isDestroyed(id)) continue;
    if (!(id in session.answers)) return i;
  }
  return session.order.length;
}

function firstPendingIndexMode1() {
  if (!session) return 0;
  for (let i = 0; i < session.order.length; i++) {
    const id = session.order[i];
    if (isDestroyed(id)) continue;
    const has = Object.prototype.hasOwnProperty.call(session.answers, id);
    if (!has || session.answers[id] === null) return i;
  }
  return session.order.length;
}

function nextLiveIndex(from, dir) {
  if (!session) return dir > 0 ? 0 : -1;
  let i = from;
  while (i >= 0 && i < session.order.length) {
    if (!isDestroyed(session.order[i])) return i;
    i += dir;
  }
  return dir > 0 ? session.order.length : -1;
}

function isFeedbackActive() {
  if (!session || !session.groundTruth) return false;
  const q = getQuestion(currentIndex);
  if (!q) return false;
  if (dismissedFeedbackFor.has(q.id)) return false;
  if (!Object.prototype.hasOwnProperty.call(session.groundTruth, q.id)) return false;
  const ans = session.answers[q.id];
  return ans !== undefined && ans !== null;
}

function computeScore() {
  if (!session || !session.groundTruth) return null;
  let correct = 0;
  let answeredWithTruth = 0;
  for (const idStr in session.answers) {
    if (!Object.prototype.hasOwnProperty.call(session.answers, idStr)) continue;
    const id = +idStr;
    if (!Object.prototype.hasOwnProperty.call(session.groundTruth, id)) continue;
    const ans = session.answers[id];
    if (ans === null || ans === undefined) continue;
    answeredWithTruth++;
    if (ans === session.groundTruth[id]) correct++;
  }
  const percent = answeredWithTruth > 0 ? Math.round((correct / answeredWithTruth) * 1000) / 10 : 0;
  return { correct: correct, answeredWithTruth: answeredWithTruth, percent: percent };
}

function slugify(name) {
  return (name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "player";
}

function todayDateStr() {
  const d = new Date();
  const m = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + m(d.getMonth() + 1) + "-" + m(d.getDate());
}

function buildExportPayload(finishedAt) {
  const gt = session.groundTruth;
  const sessionIds = new Set(session.order);
  const playOrder = (session.playOrder || []).filter(function (id) { return sessionIds.has(id); });
  const seen = new Set(playOrder);
  const remaining = QUESTIONS.map(function (q) { return q.id; })
    .filter(function (id) { return sessionIds.has(id) && !seen.has(id); })
    .sort(function (a, b) { return a - b; });
  const orderedIds = playOrder.concat(remaining);
  const answers = orderedIds.map(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    const has = Object.prototype.hasOwnProperty.call(session.answers, id);
    const ans = has ? session.answers[id] : null;
    const correct = gt && Object.prototype.hasOwnProperty.call(gt, id) ? gt[id] : null;
    let isCorrect = null;
    if (correct !== null && ans !== null && ans !== undefined) isCorrect = ans === correct;
    const rawTime = session.times && typeof session.times[id] === "number" ? session.times[id] : null;
    const timeSec = rawTime !== null ? Math.round(rawTime * 10) / 10 : null;
    return {
      id: q.id,
      set: q.set,
      difficulty: q.difficulty,
      category: q.category,
      situation: q.situation,
      transcript: q.transcript,
      options: q.options.slice(),
      answer: ans === undefined ? null : ans,
      correct_answer: correct,
      is_correct: isCorrect,
      time_seconds: timeSec
    };
  }).filter(function (item) { return item.answer !== null; });
  const score = computeScore();
  const payload = {
    player: session.player,
    mode: session.mode,
    question_set: session.questionSet || "both",
    difficulties: (session.difficulties || VALID_DIFFICULTIES).slice(),
    started_at: session.startedAt,
    finished_at: finishedAt,
    randomized: !!session.randomized,
    ground_truth_loaded: !!gt,
    play_order: playOrder.slice(),
    score: gt && score ? { correct: score.correct, answered_with_truth: score.answeredWithTruth, percent: score.percent } : null,
    answers: answers
  };
  if (session.mode === "test") {
    payload.test_sequence = { easy: TEST_SEQUENCE_SHAPE.easy, medium: TEST_SEQUENCE_SHAPE.medium, hard: TEST_SEQUENCE_SHAPE.hard };
  }
  return payload;
}

function computeCurrentTimes() {
  if (!session) return {};
  const result = Object.assign({}, session.times || {});
  if (_activeQid !== null && _activeStartedAt !== null) {
    const elapsed = (Date.now() - _activeStartedAt) / 1000;
    result[_activeQid] = (result[_activeQid] || 0) + elapsed;
  }
  return result;
}

function buildMode1ExportPayload(exportedAt) {
  const qs = session.questionSet || "both";
  const diffs = (session.difficulties || VALID_DIFFICULTIES).slice();
  const scopeQs = QUESTIONS.filter(function (q) {
    if (qs !== "both" && q.set !== qs) return false;
    if (diffs.indexOf(q.difficulty) === -1) return false;
    // Source-discarded questions are excluded from the export entirely, except
    // when the user already had an answer recorded before the source-level discard
    // was added; in that case we keep the row with a source_discarded marker.
    if (isSourceDiscarded(q.id)) {
      const hadAns = session.answers && session.answers[q.id] !== undefined && session.answers[q.id] !== null;
      if (!hadAns) return false;
    }
    return true;
  });
  const scopeIds = scopeQs.map(function (q) { return q.id; });
  const sortedIds = scopeIds.slice().sort(function (a, b) { return a - b; });
  const times = computeCurrentTimes();

  let answeredCount = 0, destroyedCount = 0;
  const answers = sortedIds.map(function (id) {
    const q = QUESTIONS.find(function (x) { return x.id === id; });
    const sourceDiscarded = isSourceDiscarded(id);
    const destroyed = isDestroyed(id);
    const hasAns = Object.prototype.hasOwnProperty.call(session.answers, id);
    const ans = hasAns ? session.answers[id] : null;
    // Source-discarded rows don't count toward stats; they're carried for reference.
    if (!sourceDiscarded) {
      if (destroyed) destroyedCount++;
      else if (ans !== null && ans !== undefined) answeredCount++;
    }
    const rawTime = typeof times[id] === "number" ? times[id] : null;
    const timeSec = rawTime !== null ? Math.round(rawTime * 10) / 10 : null;
    const isUncertain = !destroyed && !!(session.uncertain && session.uncertain[id]);
    const note = (session.notes && typeof session.notes[id] === "string") ? session.notes[id] : "";
    const sourceNote = sourceNoteFor(id);
    const item = {
      id: q.id,
      set: q.set,
      difficulty: q.difficulty,
      category: q.category,
      situation: q.situation,
      transcript: q.transcript,
      options: q.options.slice(),
      answer: destroyed ? null : (ans === undefined ? null : ans),
      correct_answer: null,
      destroyed: !!destroyed,
      uncertain: isUncertain,
      note: note
    };
    if (sourceNote) item.source_note = sourceNote;
    if (sourceDiscarded) item.source_discarded = true;
    if (destroyed) {
      const meta = (session.destroyed && session.destroyed[id])
        || (session.identity === "frances" && mathieuDraftCache && mathieuDraftCache.destroyed && mathieuDraftCache.destroyed[id])
        || null;
      item.destroyed_at = meta ? meta.at : null;
    } else if (timeSec !== null) {
      item.time_seconds = timeSec;
    }
    return item;
  });

  const total = scopeIds.length;
  const remaining = Math.max(0, total - answeredCount - destroyedCount);

  const derived = {};
  answers.forEach(function (a) {
    if (a.source_discarded) return;
    if (!a.destroyed && a.answer !== null) derived[a.id] = a.answer;
  });

  const scopeSet = new Set(scopeIds);
  const playOrder = (session.playOrder || []).filter(function (id) { return scopeSet.has(id); });
  const identity = session.identity || "flore_mathieu";

  return {
    player: session.player,
    identity: identity,
    role: IDENTITY_ROLES[identity] || "draft",
    mode: "practice_no_truth",
    started_at: session.startedAt,
    exported_at: exportedAt,
    previous_exported_at: session.lastExportAt || null,
    question_set: qs,
    difficulties: diffs,
    stats: { total: total, answered: answeredCount, destroyed: destroyedCount, remaining: remaining },
    derived_ground_truth: derived,
    play_order: playOrder,
    answers: answers
  };
}

function mode1ExportFilename(identity) {
  const date = todayDateStr();
  if (identity === "frances") return "ground-truth-frances-" + date + ".json";
  return "draft-ground-truth-mathieu-" + date + ".json";
}

function downloadJSON() {
  if (!session) return;
  if (session.mode === "practice_no_truth") {
    const nowIso = new Date().toISOString();
    const payload = buildMode1ExportPayload(nowIso);
    const filename = mode1ExportFilename(session.identity || "flore_mathieu");
    triggerDownload(JSON.stringify(payload, null, 2), filename, "application/json");
    session.lastExportAt = nowIso;
    session.exportRemindAt = totalActiveSeconds() + 30 * 60;
    saveSession();
    flashSaved();
    return;
  }
  const finishedAt = new Date().toISOString();
  const payload = buildExportPayload(finishedAt);
  const filename = "quiz-results-" + slugify(session.player) + "-" + todayDateStr() + ".json";
  triggerDownload(JSON.stringify(payload, null, 2), filename, "application/json");
}

function triggerExportCurrentState() {
  if (!session || session.mode !== "practice_no_truth") return;
  finalizeTimer();
  const nowIso = new Date().toISOString();
  const payload = buildMode1ExportPayload(nowIso);
  const filename = "quiz-mode1-" + slugify(session.player) + "-" + todayDateStr() + ".json";
  triggerDownload(JSON.stringify(payload, null, 2), filename, "application/json");
  session.lastExportAt = nowIso;
  session.exportRemindAt = totalActiveSeconds() + 30 * 60;
  saveSession();
  flashSaved();
  if (screen === "quiz") render();
}

function triggerEndSession() {
  if (!session) return;
  finalizeTimer();
  screen = "results";
  pendingDiscardConfirm = false;
  render();
}

function triggerDownload(content, filename, mime) {
  const blob = new Blob([content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 0);
}

function ensureTimingActive(qid) {
  if (_activeQid === qid && _activeStartedAt !== null) return;
  if (_activeQid !== null && _activeStartedAt !== null) finalizeTimer();
  _activeQid = qid;
  _activeStartedAt = Date.now();
}

function ensureTimingStopped(qid) {
  if (_activeQid === qid && _activeStartedAt !== null) finalizeTimer();
}

function finalizeTimer() {
  if (_activeQid === null || _activeStartedAt === null) return;
  const elapsed = (Date.now() - _activeStartedAt) / 1000;
  if (session) {
    if (!session.times) session.times = {};
    session.times[_activeQid] = (session.times[_activeQid] || 0) + elapsed;
    saveSession();
  }
  _lastFinalizedDeltaSec = elapsed;
  _activeQid = null;
  _activeStartedAt = null;
}

function back() {
  if (!session || currentIndex === 0) return;
  const target = nextLiveIndex(currentIndex - 1, -1);
  if (target < 0) return;
  currentIndex = target;
  const q = getQuestion(currentIndex);
  if (q) dismissedFeedbackFor.add(q.id);
  pendingDiscardConfirm = false;
  suppressNextFade = true;
  render();
}

function countAnsweredAndSkipped() {
  let answered = 0, skipped = 0;
  if (!session) return { answered: 0, skipped: 0, total: 0 };
  session.order.forEach(function (id) {
    if (!Object.prototype.hasOwnProperty.call(session.answers, id)) return;
    if (session.answers[id] === null) skipped++;
    else answered++;
  });
  return { answered: answered, skipped: skipped, total: session.order.length };
}

function showModal(opts) {
  const overlay = el("div", { class: "modal-overlay" });
  const close = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
  overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
  const modal = el("div", { class: "modal" });
  if (opts.title) modal.appendChild(el("h3", { text: opts.title }));
  if (opts.message) modal.appendChild(el("p", { text: opts.message }));
  const row = el("div", { class: "button-row" });
  row.appendChild(el("button", {
    class: "secondary",
    text: opts.cancelLabel || "Cancel",
    onclick: function () { close(); if (typeof opts.onCancel === "function") opts.onCancel(); }
  }));
  row.appendChild(el("button", {
    class: "primary",
    text: opts.confirmLabel || "Confirm",
    onclick: function () { close(); if (typeof opts.onConfirm === "function") opts.onConfirm(); }
  }));
  modal.appendChild(row);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function triggerFinish() {
  const counts = countAnsweredAndSkipped();
  const allReached = (counts.answered + counts.skipped) >= counts.total;
  const doFinish = function () {
    finalizeTimer();
    screen = "results";
    render();
    downloadJSON();
  };
  if (allReached) {
    doFinish();
    return;
  }
  showModal({
    title: "Finish now?",
    message: "You've answered " + counts.answered + " of " + counts.total + " questions" + (counts.skipped > 0 ? ", " + counts.skipped + " skipped" : "") + ".",
    confirmLabel: "Finish",
    cancelLabel: "Cancel",
    onConfirm: doFinish
  });
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) node.setAttribute(k, "");
      else if (attrs[k] === false || attrs[k] == null) { /* skip */ }
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(function (c) { if (c) node.appendChild(c); });
  return node;
}

function renderTranscript(text) {
  const frag = document.createDocumentFragment();
  let rest = text || "";
  const speakerMatch = rest.match(/^([^:\n]{1,80}:)\s*/);
  if (speakerMatch) {
    const sp = document.createElement("span");
    sp.className = "speaker";
    sp.textContent = speakerMatch[1];
    frag.appendChild(sp);
    rest = rest.slice(speakerMatch[0].length);
  }
  const parts = rest.split(/(\*\*[^*]+\*\*)/);
  parts.forEach(function (p) {
    if (!p) return;
    if (p.length >= 4 && p.slice(0, 2) === "**" && p.slice(-2) === "**") {
      const m = document.createElement("mark");
      m.textContent = p.slice(2, -2);
      frag.appendChild(m);
    } else {
      frag.appendChild(document.createTextNode(p));
    }
  });
  return frag;
}

function render() {
  if (screen !== "quiz") finalizeTimer();
  // Clean up render-managed overlays (transient showModal overlays manage their own lifecycle).
  const stale = document.querySelectorAll(".modal-overlay .discarded-modal");
  for (let i = 0; i < stale.length; i++) {
    const ov = stale[i].closest(".modal-overlay");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  app.innerHTML = "";
  const inTestQuiz = screen === "quiz" && session && session.mode === "test";
  const inSidebarQuiz = screen === "quiz" && session && (session.mode === "test" || session.mode === "practice_no_truth");
  document.body.classList.toggle("test-mode", inTestQuiz);
  document.body.classList.toggle("has-sidebar", inSidebarQuiz);
  // Identity tint: prefer active session identity in mode 1; otherwise pending identity on landing.
  let activeIdentity = null;
  if (session && session.identity) activeIdentity = session.identity;
  else if (screen === "landing") activeIdentity = pendingIdentity;
  IDENTITIES.forEach(function (id) {
    document.body.classList.toggle("identity-active-" + id, activeIdentity === id);
  });
  if (screen === "landing") renderLanding();
  else if (screen === "quiz") renderQuiz();
  else if (screen === "review") renderReview();
  else if (screen === "results") renderResults();
  window.scrollTo(0, 0);
}

function renderSidebar(currentSet) {
  const sidebar = el("aside", { class: "test-sidebar" });
  sidebar.appendChild(el("div", { class: "test-sidebar-title", text: "SOAP framework" }));
  SOAP_TREE.forEach(function (node) {
    const block = el("div", { class: "soap-node soap-" + node.color });
    block.setAttribute("data-soap-node", node.name);
    block.appendChild(el("div", { class: "soap-name", text: node.name }));
    if (currentSet === "subsection") {
      const list = el("ul", { class: "sub-list" });
      node.subs.forEach(function (sub) {
        const li = el("li", { class: "sub-node", text: sub });
        li.setAttribute("data-sub-node", sub);
        list.appendChild(li);
      });
      block.appendChild(list);
    }
    sidebar.appendChild(block);
  });
  return sidebar;
}

function highlightSidebarFor(opt) {
  clearSidebarHighlight();
  const sub = OPTION_TO_SUB[opt];
  if (!sub) return;
  const subEl = document.querySelector('[data-sub-node="' + sub + '"]');
  if (subEl) subEl.classList.add("hover");
  const soap = SUB_TO_SOAP[sub];
  if (soap) {
    const soapEl = document.querySelector('[data-soap-node="' + soap + '"]');
    if (soapEl) soapEl.classList.add("hover-parent");
  }
}

function clearSidebarHighlight() {
  const subs = document.querySelectorAll(".sub-node.hover");
  for (let i = 0; i < subs.length; i++) subs[i].classList.remove("hover");
  const tops = document.querySelectorAll(".soap-node.hover-parent");
  for (let i = 0; i < tops.length; i++) tops[i].classList.remove("hover-parent");
}

function renderLanding() {
  app.appendChild(el("h1", { text: "SOAP Classification Quiz" }));
  app.appendChild(el("p", { text: "Click through 144 medical-documentation edge cases. Pick the bucket that feels right." }));

  let hasResume = false;
  IDENTITIES.forEach(function (id) {
    if (mode1SavedSessions[id]) { renderMode1ResumePanel(id); hasResume = true; }
  });
  if (hasResume) {
    app.appendChild(el("div", { class: "new-session-divider", text: "Or start a new session" }));
  }

  renderOnboarding();
}

function renderMode1ResumePanel(identity) {
  const ms = mode1SavedSessions[identity];
  if (!ms) return;
  // Frances's stats should reflect Mathieu's discards too.
  let mathieuForStats = null;
  if (identity === "frances") {
    mathieuForStats = mathieuDraftCache || loadMathieuDraft();
  }
  const statsCtx = { destroyed: ms.destroyed || {} };
  const ids = ms.order || [];
  const extraDiscards = (identity === "frances" && mathieuForStats && mathieuForStats.destroyed) ? mathieuForStats.destroyed : null;
  let answered = 0, destroyedN = 0;
  ids.forEach(function (id) {
    if (statsCtx.destroyed[id] || (extraDiscards && extraDiscards[id])) { destroyedN++; return; }
    const ans = ms.answers ? ms.answers[id] : undefined;
    if (ans !== null && ans !== undefined) answered++;
  });
  const remaining = Math.max(0, ids.length - answered - destroyedN);

  const panel = el("div", { class: "resume-panel identity-resume identity-resume-" + identity });
  panel.appendChild(el("h2", { text: "Resume authoring \u2014 " + IDENTITY_LABELS[identity] }));
  panel.appendChild(el("p", {
    class: "muted",
    text: answered + " answered, " + destroyedN + " discarded, " + remaining + " remaining (out of " + ids.length + ")"
  }));
  if (identity === "frances" && !mathieuForStats) {
    panel.appendChild(el("p", { class: "muted small", text: "No draft from Flore & Mathieu found. Frances normally builds on top of that draft." }));
  }

  const row = el("div", { class: "button-row" });
  row.appendChild(el("button", {
    class: "primary",
    text: "Resume",
    onclick: function () {
      pendingIdentity = identity;
      persistActiveIdentity();
      session = mode1SavedSessions[identity];
      if (identity === "frances") {
        mathieuDraftCache = loadMathieuDraft();
      } else {
        mathieuDraftCache = null;
      }
      currentIndex = firstPendingIndexMode1();
      if (currentIndex >= session.order.length) screen = "results";
      else screen = "quiz";
      dismissedFeedbackFor = new Set();
      pendingDiscardConfirm = false;
      mode1BarValues = {};
      expandedRecentId = null;
      noteExpandedFor = new Set();
      jumpPanelOpen = false;
      discardedModalOpenFor = null;
      expandedMathieuNoteFor = null;
      suppressNextFade = true;
      lastActivityAt = Date.now();
      welcomeBackShownAt = Date.now();
      initPlaySession();
      render();
    }
  }));
  row.appendChild(el("button", {
    class: "secondary",
    text: "Start over",
    onclick: function () {
      if (!confirm("Start over for " + IDENTITY_LABELS[identity] + "? This clears their answers, notes, and discards.")) return;
      clearMode1SessionFor(identity);
      pendingDiscardConfirm = false;
      mode1BarValues = {};
      render();
    }
  }));
  panel.appendChild(row);

  const ownDestroyed = Object.keys(ms.destroyed || {}).length;
  const sourceDiscardedCount = Object.keys(SOURCE_DISCARDED).length;
  if (ownDestroyed > 0 || sourceDiscardedCount > 0) {
    const moreRow = el("div", { class: "button-row" });
    let label;
    if (ownDestroyed > 0 && sourceDiscardedCount > 0) {
      label = "View discarded (" + ownDestroyed + " session \u00b7 " + sourceDiscardedCount + " source)";
    } else if (ownDestroyed > 0) {
      label = "View discarded (" + ownDestroyed + ")";
    } else {
      label = "View discarded in source (" + sourceDiscardedCount + ")";
    }
    moreRow.appendChild(el("button", {
      class: "link",
      text: label,
      onclick: function () { discardedModalOpenFor = identity; render(); }
    }));
    panel.appendChild(moreRow);
  }

  app.appendChild(panel);

  if (discardedModalOpenFor === identity) renderDiscardedModalFor(identity);
}

function renderDiscardedModalFor(identity) {
  const state = (session && session.mode === "practice_no_truth" && session.identity === identity) ? session : mode1SavedSessions[identity];
  if (!state) return;
  const overlay = el("div", { class: "modal-overlay" });

  head.appendChild(el("button", {
    class: "link",
    text: "Close",
    onclick: function () { discardedModalOpenFor = null; render(); }
  }));
  modal.appendChild(head);

  function buildItemRow(q, opts) {
    const row = el("div", { class: "discarded-item" });
    const meta = el("div", { class: "discarded-meta" });
    meta.appendChild(el("span", { class: "discarded-id", text: "#" + q.id }));
    meta.appendChild(el("span", { class: "discarded-cat", text: q.category }));

    row.appendChild(el("div", { class: "discarded-sit", text: q.situation }));
    const preview = q.transcript.replace(/\*\*/g, "");
    const short = preview.length > 140 ? preview.slice(0, 137) + "\u2026" : preview;
    row.appendChild(el("div", { class: "discarded-preview", text: short }));
    if (opts && opts.restorable) {
      const actions = el("div", { class: "discarded-actions" });
      actions.appendChild(el("button", {
        class: "secondary",
        text: "Restore",
        onclick: function () {
          restoreQuestionInState(state, q.id);
